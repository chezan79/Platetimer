<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations — Chef de Brigade — PlateTimer</title>
<link rel="stylesheet" href="css/operations.css">
</head>
<body>

<header class="hdr">
  <span id="hdr-company" class="hdr-brand"></span>
  <span class="hdr-sep"></span>
  <span class="hdr-page">Operations · Chef de Brigade</span>
  <button class="hdr-btn" onclick="location.href='operations-tasks.html'">Compiti</button>
  <button class="hdr-btn" onclick="location.href='home.html'">Home</button>
  <button class="hdr-btn danger" onclick="OpsCommon.logout()">Esci</button>
</header>

<main class="main">
  <div class="pg-heading">
    <h1 class="pg-title">Il mio prossimo compito</h1>
    <p class="pg-sub"><span id="me-name"></span> · <span id="me-role" class="role-badge"></span></p>
  </div>

  <div id="ops-error" class="msg msg-error" style="display:none"></div>

  <!-- Next task — primary focus -->
  <div id="next-task-section" style="display:none">
    <div class="next-task-card" id="next-task-card">
      <div class="next-task-label">⭐ PROSSIMO COMPITO</div>
      <div class="next-task-title" id="nt-title">—</div>
      <div class="next-task-meta" id="nt-meta">—</div>
      <div class="next-task-actions">
        <button class="btn btn-primary" id="nt-start-btn">▶ Inizia ora</button>
        <button class="btn btn-ok" id="nt-complete-btn">✓ Completa</button>
        <button class="btn btn-neutral" id="nt-view-btn">Dettagli →</button>
      </div>
    </div>
  </div>
  <div id="no-next-task" style="display:none;margin-bottom:24px">
    <div class="brief-card" style="border-color:var(--ok)">
      <div class="brief-text" style="color:var(--ok)">✅ Tutti i compiti completati. Ottimo lavoro!</div>
    </div>
  </div>

  <!-- Minimal stats -->
  <div class="stat-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px">
    <div class="stat-card"><div class="stat-num" id="stat-open">—</div><div class="stat-lbl">Da fare</div></div>
    <div class="stat-card danger"><div class="stat-num" id="stat-urgent">—</div><div class="stat-lbl">Urgenti</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-today">—</div><div class="stat-lbl">Oggi</div></div>
    <div class="stat-card ok"><div class="stat-num" id="stat-done">—</div><div class="stat-lbl">Completati oggi</div></div>
  </div>

  <!-- Secondary button -->
  <div style="margin-bottom:24px">
    <button class="btn btn-neutral" style="width:100%;padding:14px;font-size:15px" onclick="location.href='operations-tasks.html'">
      📋 Visualizza tutti i miei compiti
    </button>
  </div>

  <!-- Task lists (simple) -->
  <div id="role-intel" class="role-intel-area"></div>
  <div id="main-content"></div>
</main>

<script src="js/ws-auth.js"></script>
<script src="js/operations-common.js"></script>
<script src="js/operations-realtime.js"></script>
<script>
const esc = OpsCommon.escHtml;

async function load() {
  const me = await OpsCommon.loadMe();
  if (!me) return;
  if (me.user.role !== 'CHEF_DE_BRIGADE') { location.replace('operations.html'); return; }
  document.getElementById('me-name').textContent = me.user.name || '';
  document.getElementById('me-role').textContent = OpsCommon.roleLabel(me.user.role);
  const myId = me.user.id;

  const data = await OpsCommon.api('/api/operations/tasks');
  if (!data || !data.success) { OpsCommon.showError(data && data.error); return; }
  const tasks = data.tasks, users = data.users;
  const now = new Date();

  const mine    = tasks.filter(t => t.assigneeId === myId);
  const active  = mine.filter(t => t.status !== 'COMPLETED' && t.status !== 'CANCELLED');
  const urgent  = active.filter(t => t.priority === 'URGENT');
  const overdue = active.filter(t => (t.effectiveStatus||t.status)==='OVERDUE' || (t.dueDate && new Date(t.dueDate) < now));
  const today   = active.filter(t => OpsCommon.isToday(t.dueDate));
  const dueSoon = active.filter(t => {
    if (!t.dueDate) return false;
    const d = new Date(t.dueDate), diff = d - now;
    return diff > 0 && diff < 48 * 3600000;
  });
  const done    = mine.filter(t => OpsCommon.isCompletedToday(t));

  document.getElementById('stat-open').textContent   = active.length;
  document.getElementById('stat-urgent').textContent = urgent.length;
  document.getElementById('stat-today').textContent  = today.length;
  document.getElementById('stat-done').textContent   = done.length;

  // Next task
  const next = OpsCommon.nextTask(tasks, myId);
  if (next) {
    document.getElementById('next-task-section').style.display = '';
    document.getElementById('nt-title').textContent = next.title;
    document.getElementById('nt-meta').textContent  = '📅 ' + OpsCommon.fmtDue(next.dueDate) +
      (next.department ? '  ·  🏠 ' + next.department : '') +
      '  ·  ' + (OpsCommon.PRIORITY_LABELS[next.priority] || next.priority);

    const startBtn    = document.getElementById('nt-start-btn');
    const completeBtn = document.getElementById('nt-complete-btn');

    if (next.status !== 'OPEN') startBtn.style.display = 'none';
    startBtn.onclick = async () => {
      startBtn.disabled = true;
      const r = await OpsCommon.api('/api/operations/tasks/' + next.id + '/start', { method: 'POST' });
      if (r && r.success) load(); else { OpsCommon.showError(r && r.error); startBtn.disabled = false; }
    };
    completeBtn.onclick = async () => {
      completeBtn.disabled = true;
      const r = await OpsCommon.api('/api/operations/tasks/' + next.id + '/complete', { method: 'POST' });
      if (r && r.success) load(); else { OpsCommon.showError(r && r.error); completeBtn.disabled = false; }
    };
    document.getElementById('nt-view-btn').onclick = () => { location.href = 'operations-tasks.html#' + next.id; };
  } else {
    document.getElementById('no-next-task').style.display = '';
  }

  const container = document.getElementById('main-content');
  container.innerHTML = '';
  OpsCommon.renderSection(container, '🕐 In ritardo', overdue, users, 'Nessun compito in ritardo.');
  OpsCommon.renderSection(container, '⚡ Urgenti', urgent.filter(t=>!overdue.find(o=>o.id===t.id)), users, 'Nessun compito urgente.');
  OpsCommon.renderSection(container, '📅 Oggi', today.filter(t=>!overdue.find(o=>o.id===t.id)), users, 'Nessun compito in scadenza oggi.');
  OpsCommon.renderSection(container, '✅ Completati oggi', done, users, 'Nessun compito completato oggi.');

  // Sprint 6.2: personal intelligence
  const intelRes = await OpsCommon.api('/api/operations/intelligence');
  renderRoleIntel(intelRes);
}

function renderRoleIntel(r) {
  const area = document.getElementById('role-intel');
  if (!r || !r.success || !area) return;
  const parts = [];
  if (r.briefing) parts.push(`<div class="role-intel-briefing">${esc(r.briefing)}</div>`);
  if (r.myTasks) {
    const m = r.myTasks;
    parts.push(`<div class="role-intel-metrics">
      <span>${m.assigned} attivi</span>
      ${m.overdue?`<span style="color:#dc2626"> · ${m.overdue} ritardo</span>`:''}
      ${m.urgent?`<span style="color:#d97706"> · ${m.urgent} urgenti</span>`:''}
      ${m.completedToday?`<span style="color:#16a34a"> · ${m.completedToday} completati</span>`:''}
    </div>`);
  }
  area.innerHTML = parts.join('');
}

load();

// Sprint 5: real-time live updates ──────────────────────────────────────────
OpsRealtime.init();
let _rtTimer = null;
function rtReload(d) { clearTimeout(_rtTimer); _rtTimer = setTimeout(load, d || 700); }
OpsRealtime.on('OPS_TASK_CREATED',    () => { rtReload(400); OpsRealtime.toast('📌 Nuovo compito', 'info'); });
OpsRealtime.on('OPS_TASK_UPDATED',    () => { rtReload(500); });
OpsRealtime.on('OPS_TASK_COMPLETED',  () => { rtReload(400); OpsRealtime.toast('✅ Completato!', 'ok'); });
OpsRealtime.on('OPS_TASK_REASSIGNED', () => { rtReload(400); OpsRealtime.toast('🔄 Riassegnato', 'info'); });
OpsRealtime.on('OPS_TASK_PROGRESS',   () => { rtReload(600); });
OpsRealtime.on('OPS_COMMENT_ADDED',   () => { rtReload(800); });
</script>
</body>
</html>
