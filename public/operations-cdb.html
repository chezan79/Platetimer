<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations — Chef de Brigade — PlateTimer</title>
<link rel="stylesheet" href="css/operations.css">
<script src="js/i18n.js"></script>
</head>
<body>

<header class="hdr">
  <span id="hdr-company" class="hdr-brand"></span>
  <span class="hdr-sep"></span>
  <span class="hdr-page">Operations · Chef de Brigade</span>
  <button class="hdr-btn" onclick="location.href='operations-tasks.html'" data-i18n="ops.nav.tasks">Compiti</button>
  <button class="hdr-btn" onclick="location.href='operations-performance.html'" data-i18n="ops.nav.profile">📊 Il mio profilo</button>
  <button class="hdr-btn" onclick="location.href='home.html'" data-i18n="common.home">Home</button>
  <span id="i18n-sel"></span>
  <button class="hdr-btn danger" onclick="OpsCommon.logout()" data-i18n="common.logout">Esci</button>
</header>

<main class="main">
  <div class="pg-heading">
    <h1 class="pg-title" data-i18n="ops.cdb.heading">Il mio prossimo compito</h1>
    <p class="pg-sub"><span id="me-name"></span> · <span id="me-role" class="role-badge"></span></p>
  </div>

  <div id="ops-error" class="msg msg-error" style="display:none"></div>

  <!-- Next task — primary focus -->
  <div id="next-task-section" style="display:none">
    <div class="next-task-card" id="next-task-card">
      <div class="next-task-label" data-i18n="ops.sc.nextTask">⭐ PROSSIMO COMPITO</div>
      <div class="next-task-title" id="nt-title">—</div>
      <div class="next-task-meta" id="nt-meta">—</div>
      <div class="next-task-actions">
        <button class="btn btn-primary" id="nt-start-btn" data-i18n="ops.sc.startNow">▶ Inizia ora</button>
        <button class="btn btn-ok" id="nt-complete-btn" data-i18n="ops.sc.complete">✓ Completa</button>
        <button class="btn btn-neutral" id="nt-view-btn" data-i18n="ops.sc.details">Dettagli →</button>
      </div>
    </div>
  </div>
  <div id="no-next-task" style="display:none;margin-bottom:24px">
    <div class="brief-card" style="border-color:var(--ok)">
      <div class="brief-text" style="color:var(--ok)" data-i18n="ops.sc.allDone">✅ Tutti i compiti completati. Ottimo lavoro!</div>
    </div>
  </div>

  <!-- Minimal stats -->
  <div class="stat-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px">
    <div class="stat-card"><div class="stat-num" id="stat-open">—</div><div class="stat-lbl" data-i18n="ops.cdb.todo">Da fare</div></div>
    <div class="stat-card danger"><div class="stat-num" id="stat-urgent">—</div><div class="stat-lbl" data-i18n="ops.sc.urgentStat">Urgenti</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-today">—</div><div class="stat-lbl" data-i18n="ops.sc.todayStat">Oggi</div></div>
    <div class="stat-card ok"><div class="stat-num" id="stat-done">—</div><div class="stat-lbl" data-i18n="ops.sc.completedStat">Completati oggi</div></div>
  </div>

  <!-- Secondary button -->
  <div style="margin-bottom:24px">
    <button class="btn btn-neutral" style="width:100%;padding:14px;font-size:15px" onclick="location.href='operations-tasks.html'" data-i18n="ops.task.viewAll">
      📋 Visualizza tutti i miei compiti
    </button>
  </div>

  <!-- Quick Actions -->
  <div class="qa-grid" style="margin-bottom:24px">
    <button class="qa-btn" onclick="location.href='operations-calendar.html'">
      <span class="qa-icon">📅</span><span data-i18n="ops.cal.quickAction">Calendario</span>
    </button>
  </div>

  <!-- Task lists (simple) -->
  <div id="role-intel" class="role-intel-area"></div>
  <div id="main-content"></div>
</main>

<script src="js/i18n.js"></script>
<script src="js/ws-auth.js"></script>
<script src="js/operations-common.js"></script>
<script src="js/operations-realtime.js"></script>
<script>
const esc = OpsCommon.escHtml;
const t = (key) => (typeof I18n !== 'undefined' && I18n.t) ? I18n.t(key) : key;

// Module-level state shared between load() and optimistic updates
let _tasks = [], _myId = null, _loadInFlight = false, _pendingReload = false;

// Render (or clear) the next-task card from a given task array + user id.
// Called both from load() and immediately after optimistic local mutations
// so the card stays in sync without waiting for a server round-trip.
function renderNextTaskCard(tasks, myId) {
  const secEl = document.getElementById('next-task-section');
  const noEl  = document.getElementById('no-next-task');
  secEl.style.display = 'none';
  noEl.style.display  = 'none';

  const next = OpsCommon.nextTask(tasks, myId);
  if (next) {
    secEl.style.display = '';
    document.getElementById('nt-title').textContent = next.title;
    document.getElementById('nt-meta').textContent  = '📅 ' + OpsCommon.fmtDue(next.dueDate) +
      (next.department ? '  ·  🏠 ' + next.department : '') +
      '  ·  ' + OpsCommon.priorityLabel(next.priority);

    const startBtn    = document.getElementById('nt-start-btn');
    const completeBtn = document.getElementById('nt-complete-btn');

    // Always reset disabled state: the card reuses persistent DOM buttons, so
    // after completing task A (which set completeBtn.disabled=true), the card
    // must re-enable the buttons before binding handlers for the next task B.
    startBtn.disabled    = false;
    completeBtn.disabled = false;

    startBtn.style.display = next.status !== 'OPEN' ? 'none' : '';
    startBtn.onclick = async () => {
      startBtn.disabled = true;
      const r = await OpsCommon.api('/api/operations/tasks/' + next.id + '/start', { method: 'POST' });
      if (r && r.success) load();
      else { OpsCommon.showError(r && r.error); startBtn.disabled = false; }
    };
    completeBtn.onclick = async () => {
      completeBtn.disabled = true;
      const r = await OpsCommon.api('/api/operations/tasks/' + next.id + '/complete', { method: 'POST' });
      if (r && r.success) {
        // Optimistic update: mark the task locally so the card re-renders
        // immediately without waiting for the WS broadcast + debounced reload.
        const idx = _tasks.findIndex(tk => tk.id === next.id);
        if (idx !== -1) { _tasks[idx] = { ..._tasks[idx], status: 'COMPLETED' }; }
        renderNextTaskCard(_tasks, _myId);
        load(); // full refresh in background (in-flight guard prevents overlap)
      } else { OpsCommon.showError(r && r.error); completeBtn.disabled = false; }
    };
    // Fix: use ?taskId= query param so operations-tasks.html can auto-open the panel
    document.getElementById('nt-view-btn').onclick = () => {
      location.href = 'operations-tasks.html?taskId=' + encodeURIComponent(next.id);
    };
  } else {
    noEl.style.display = '';
  }
}

async function load(isRealtime) {
  // In-flight guard with pending-reload: if a load is already running, mark
  // it as pending so a trailing reload fires in the finally block after the
  // current one completes. This ensures no WS event / user action is silently
  // dropped — the last mutation always produces a fresh fetch.
  if (_loadInFlight) { _pendingReload = true; return; }
  _loadInFlight = true;
  _pendingReload = false;
  try {
    await I18n.init({ selector: false });
    const me = await OpsCommon.loadMe();
    if (!me) return;
    if (me.user.role !== 'CHEF_DE_BRIGADE') { location.replace('operations.html'); return; }
    document.getElementById('me-name').textContent = me.user.name || '';
    document.getElementById('me-role').textContent = OpsCommon.roleLabel(me.user.role);
    _myId = me.user.id;

    const data = await OpsCommon.api('/api/operations/tasks');
    if (!data || !data.success) { OpsCommon.showError(data && data.error); return; }
    _tasks = data.tasks;
    const users = data.users;
    const now = new Date();

    const mine    = _tasks.filter(tk => tk.assigneeId === _myId);
    const active  = mine.filter(tk => tk.status !== 'COMPLETED' && tk.status !== 'CANCELLED');
    const urgent  = active.filter(tk => tk.priority === 'URGENT');
    const overdue = active.filter(tk => (tk.effectiveStatus||tk.status)==='OVERDUE' || (tk.dueDate && new Date(tk.dueDate) < now));
    const today   = active.filter(tk => OpsCommon.isToday(tk.dueDate));
    const done    = mine.filter(tk => OpsCommon.isCompletedToday(tk));

    document.getElementById('stat-open').textContent   = active.length;
    document.getElementById('stat-urgent').textContent = urgent.length;
    document.getElementById('stat-today').textContent  = today.length;
    document.getElementById('stat-done').textContent   = done.length;

    // Render next-task card from the freshly-fetched task array
    renderNextTaskCard(_tasks, _myId);

    const container = document.getElementById('main-content');
    container.innerHTML = '';
    OpsCommon.renderSection(container, '🕐 ' + t('ops.sec.overdue'),        overdue,                                              users, t('ops.sec.noOverdue'));
    OpsCommon.renderSection(container, '⚡ ' + t('ops.sec.urgent'),         urgent.filter(tk=>!overdue.find(o=>o.id===tk.id)),   users, t('ops.sec.noUrgent'));
    OpsCommon.renderSection(container, '📅 ' + t('ops.sec.todayDue'),      today.filter(tk=>!overdue.find(o=>o.id===tk.id)),    users, t('ops.sec.noTodayDue'));
    OpsCommon.renderSection(container, '✅ ' + t('ops.sec.completedToday'), done,                                                 users, t('ops.sec.noCompletedToday'));

    // Sprint 6.2+: personal intelligence (intentional load — updates lastVisitAt)
    const intelRes = await OpsCommon.api(OpsCommon.intelligenceUrl(isRealtime ? 'isRealtime=1' : ''));
    renderRoleIntel(intelRes);
  } finally {
    _loadInFlight = false;
    // If any load request arrived while we were fetching, do one trailing reload
    // so the card reflects the latest server state (covers the race where a WS
    // event fires during the in-flight intelligence request at the end of load).
    if (_pendingReload) { _pendingReload = false; setTimeout(() => load(true), 100); }
  }
}

function renderRoleIntel(r) {
  const area = document.getElementById('role-intel');
  if (!r || !r.success || !area) return;
  const parts = [];
  if (r.newSinceLastVisit) {
    const nsv = r.newSinceLastVisit;
    if (nsv.newCount > 0 || nsv.previousVisitAt) {
      parts.push(`<div id="cdb-nsv-content" class="card" style="margin-bottom:14px"></div>`);
    }
  }
  if (r.executiveBrief) parts.push(`<div class="role-intel-briefing">${esc(r.executiveBrief)}</div>`);
  else if (r.briefing)  parts.push(`<div class="role-intel-briefing">${esc(r.briefing)}</div>`);
  if (r.myTasks) {
    const m = r.myTasks;
    parts.push(`<div class="role-intel-metrics">
      <span>${m.assigned} ${t('ops.intel.open')}</span>
      ${m.overdue?`<span style="color:#dc2626"> · ${m.overdue} ${t('ops.intel.late')}</span>`:''}
      ${m.urgent?`<span style="color:#d97706"> · ${m.urgent} ${t('ops.intel.urgentLbl')}</span>`:''}
      ${m.completedToday?`<span style="color:#16a34a"> · ${m.completedToday} ${t('ops.intel.completedToday')}</span>`:''}
    </div>`);
  }
  if (r.riskWatch && r.riskWatch.length) {
    parts.push(`<div class="role-intel-rw">`);
    parts.push(r.riskWatch.slice(0,2).map(rk => `
      <div class="role-intel-rw-item">
        <span class="rw-level-badge rw-level-${rk.level}" style="display:inline-block;margin-right:8px">${rk.level}</span>
        <span style="font-weight:700;font-size:12px">${esc(rk.title)}</span>
      </div>`).join(''));
    parts.push(`</div>`);
  }
  area.innerHTML = parts.join('');
  if (r.newSinceLastVisit) OpsCommon.renderNewSinceLastVisit(r.newSinceLastVisit, null, 'cdb-nsv-content');
}

I18n.init({ selector: '#i18n-sel' }).then(() => load());

// Sprint 5: real-time live updates
OpsRealtime.init();
let _rtTimer = null;
// rtReload debounces rapid WS events into a single load() call. It always
// calls load() — the pending-reload flag inside load() handles the case where
// a previous load is still in-flight, guaranteeing a trailing refresh so the
// card reflects the latest mutation. The 400 ms delay for COMPLETED events is
// intentional: the server broadcasts after persisting, so 400 ms is enough for
// the HTTP fetch to also see the committed state.
function rtReload(d) {
  clearTimeout(_rtTimer);
  _rtTimer = setTimeout(() => load(true), d || 700);
}
OpsRealtime.on('OPS_TASK_CREATED',    () => { rtReload(400); OpsRealtime.toast(t('ops.rt.newTask'), 'info'); });
OpsRealtime.on('OPS_TASK_UPDATED',    () => { rtReload(500); });
OpsRealtime.on('OPS_TASK_COMPLETED',  () => { rtReload(400); OpsRealtime.toast(t('ops.rt.completed'), 'ok'); });
OpsRealtime.on('OPS_TASK_REASSIGNED', () => { rtReload(400); OpsRealtime.toast(t('ops.rt.reassigned'), 'info'); });
OpsRealtime.on('OPS_TASK_PROGRESS',   () => { rtReload(600); });
OpsRealtime.on('OPS_COMMENT_ADDED',   () => { rtReload(800); });
</script>
</body>
</html>
