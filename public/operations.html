<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations — PlateTimer</title>
<link rel="stylesheet" href="css/operations.css">
<style>
  .loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100vh;gap:16px;color:var(--muted);font-size:15px;}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading-screen">
  <div class="spinner"></div>
  <span>Caricamento dashboard…</span>
</div>
<script src="js/ws-auth.js"></script>
<script src="js/operations-common.js"></script>
<script>
const ROLE_ROUTES = {
  DIRECTOR:       'operations-director.html',
  CHEF_CUISINE:   'operations-cc.html',
  ADJOINT:        'operations-adjoint.html',
  SOUS_CHEF:      'operations-souschef.html',
  CHEF_DE_BRIGADE:'operations-cdb.html',
};
(async () => {
  const me = await OpsCommon.loadMe();
  if (!me) return;
  const route = ROLE_ROUTES[me.user.role];
  if (route) {
    location.replace(route);
  } else {
    document.querySelector('.loading-screen').innerHTML =
      '<span style="color:var(--danger)">Ruolo non riconosciuto: ' + OpsCommon.escHtml(me.user.role) + '</span>';
  }
})();
</script>
</body>
</html>
