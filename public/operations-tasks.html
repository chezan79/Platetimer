<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations — Compiti — PlateTimer</title>
<link rel="stylesheet" href="css/operations.css">
<link rel="stylesheet" href="css/operations-redesign.css">
<script src="js/i18n.js"></script>
</head>
<body class="operations-shell">

<header class="hdr">
  <a class="ops-brand" href="operations.html">
    <span class="ob-pt">PLATETIMER</span><span class="ob-sep"> / </span><span class="ob-ops">OPERATIONS</span>
  </a>
  <nav class="ops-nav">
    <a class="ops-nav-item" href="operations.html" data-i18n="ops.nav.dashboard">Dashboard</a>
    <span class="ops-nav-item active" data-i18n="ops.nav.tasks">Compiti</span>
    <a id="team-btn" class="ops-nav-item" href="operations-team.html" style="display:none" data-i18n="ops.nav.team">Team</a>
    <a id="tpl-btn" class="ops-nav-item" href="operations-templates.html" style="display:none" data-i18n="ops.nav.templates">Template</a>
  </nav>
  <div class="ops-hdr-util">
    <span id="hdr-company" class="hdr-company"></span>
    <span id="i18n-sel"></span>
    <a class="hdr-btn" href="home.html" data-i18n="common.home">Home</a>
    <button class="hdr-btn danger" onclick="OpsCommon.logout()" data-i18n="common.logout">Esci</button>
  </div>
</header>

<main class="main">
  <div class="pg-heading" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
    <div>
      <h1 class="pg-title" data-i18n="ops.nav.tasks">Compiti</h1>
      <p class="pg-sub"><span id="me-name"></span> · <span id="me-role" class="role-badge"></span></p>
    </div>
    <button class="btn btn-primary" id="new-task-btn" onclick="openCreatePanel()" data-i18n="ops.task.new">+ Nuovo compito</button>
  </div>

  <!-- Filter / search bar -->
  <div class="filter-bar">
    <!-- Status filter as compact tabs (drives the existing hidden select; same values, same logic) -->
    <div class="ops-status-tabs" id="ops-status-tabs" role="tablist">
      <button type="button" class="ops-status-tab active" data-status="" onclick="setStatusTab(this)" data-i18n="ops.task.filterAll">Tutti gli stati</button>
      <button type="button" class="ops-status-tab" data-status="OPEN" onclick="setStatusTab(this)" data-i18n="ops.task.filterOpen">Aperti</button>
      <button type="button" class="ops-status-tab" data-status="IN_PROGRESS" onclick="setStatusTab(this)" data-i18n="ops.task.filterInProgress">In corso</button>
      <button type="button" class="ops-status-tab" data-status="OVERDUE" onclick="setStatusTab(this)" data-i18n="ops.task.filterOverdue">In ritardo</button>
      <button type="button" class="ops-status-tab" data-status="COMPLETED" onclick="setStatusTab(this)" data-i18n="ops.task.filterCompleted">Completati</button>
      <button type="button" class="ops-status-tab" data-status="CANCELLED" onclick="setStatusTab(this)" data-i18n="ops.task.filterCancelled">Cancellati</button>
    </div>
    <input id="flt-search" class="form-input flt-input" data-i18n-placeholder="ops.task.searchPlaceholder" placeholder="🔍 Cerca titolo, descrizione, assegnatario…" oninput="scheduleFilter()">
    <select id="flt-status" class="form-select flt-select" style="display:none" onchange="applyFilters()">
      <option value="" data-i18n="ops.task.filterAll">Tutti gli stati</option>
      <option value="OPEN" data-i18n="ops.task.filterOpen">Aperti</option>
      <option value="IN_PROGRESS" data-i18n="ops.task.filterInProgress">In corso</option>
      <option value="OVERDUE" data-i18n="ops.task.filterOverdue">In ritardo</option>
      <option value="COMPLETED" data-i18n="ops.task.filterCompleted">Completati</option>
      <option value="CANCELLED" data-i18n="ops.task.filterCancelled">Cancellati</option>
    </select>
    <select id="flt-priority" class="form-select flt-select" onchange="applyFilters()">
      <option value="" data-i18n="ops.task.filterPriority">Tutte le priorità</option>
      <option value="URGENT" data-i18n="ops.priority.urgent">Urgente</option>
      <option value="HIGH" data-i18n="ops.priority.high">Alta</option>
      <option value="MEDIUM" data-i18n="ops.priority.medium">Media</option>
      <option value="LOW" data-i18n="ops.priority.low">Bassa</option>
    </select>
    <select id="flt-sort" class="form-select flt-select" onchange="applyFilters()">
      <option value="" data-i18n="ops.task.filterSmartSort">Ordinamento smart</option>
      <option value="dueDate" data-i18n="ops.task.filterByDue">Per scadenza</option>
      <option value="priority" data-i18n="ops.task.filterByPriority">Per priorità</option>
      <option value="createdAt" data-i18n="ops.task.filterByCreated">Per data creazione</option>
      <option value="status" data-i18n="ops.task.filterByStatus">Per stato</option>
      <option value="assignee" data-i18n="ops.task.filterByAssignee">Per assegnatario</option>
    </select>
    <label class="flt-check"><input type="checkbox" id="flt-my" onchange="applyFilters()"> <span data-i18n="ops.task.filterMine">Solo i miei</span></label>
  </div>

  <div id="ops-error" class="msg msg-error" style="display:none"></div>
  <div id="task-list" class="task-list"><div class="empty-state" data-i18n="ops.task.loading">Caricamento…</div></div>
</main>

<!-- Panel overlay -->
<div id="panel-overlay" class="panel-overlay" onclick="closePanel()"></div>

<!-- Permanent-delete confirmation modal -->
<div id="del-perm-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:600" onclick="closeDelPerm()"></div>
<div id="del-perm-modal" role="dialog" aria-modal="true" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:601;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px 24px;max-width:420px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.22)">
  <h3 style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:10px" data-i18n="ops.task.deleteConfirmTitle">Eliminare definitivamente questo compito?</h3>
  <p style="font-size:13px;color:var(--muted);margin-bottom:22px" data-i18n="ops.task.deleteConfirmBody">Questa azione è permanente e non può essere annullata.</p>
  <div style="display:flex;gap:10px;justify-content:flex-end">
    <button class="btn btn-secondary" onclick="closeDelPerm()" data-i18n="common.cancel">Annulla</button>
    <button class="btn btn-danger" onclick="confirmDeletePermanently()" data-i18n="ops.task.deletePermanently">Elimina definitivamente</button>
  </div>
</div>

<!-- Side panel: detail + create share this element -->
<div id="side-panel" class="detail-panel">
  <div id="panel-inner"></div>
</div>

<script src="js/ws-auth.js"></script>
<script src="js/operations-common.js"></script>
<script src="js/operations-realtime.js"></script>
<script>
// Shorthand helpers
const esc = OpsCommon.escHtml;
const t = (key) => (typeof I18n !== 'undefined' && I18n.t) ? I18n.t(key) : key;

// ── State ──
let allTasks = [], allUsers = {}, meData = null;
let assignableUsers = [];
let filterTimer = null;

// [S6.4.1] Files staged for upload during task creation.
let _pendingAttachments = [];

// ── Boot ──
async function load() {
  meData = await OpsCommon.loadMe();
  if (!meData) return;
  document.getElementById('me-name').textContent = meData.user.name || '';
  document.getElementById('me-role').textContent = OpsCommon.roleLabel(meData.user.role);
  if (meData.user.role === 'DIRECTOR') {
    document.getElementById('team-btn').style.display = '';
    document.getElementById('tpl-btn').style.display = '';
  }

  const aData = await OpsCommon.api('/api/operations/assignees');
  assignableUsers = (aData && aData.assignees) || [];

  await loadTasks();
}

// ── Filter helpers ──
function scheduleFilter() {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(applyFilters, 280);
}

function applyFilters() {
  clearTimeout(filterTimer);
  loadTasks();
}

// Status tabs are a visual layer over the existing #flt-status select:
// they only set its value and call the same applyFilters() path.
function setStatusTab(btn) {
  document.querySelectorAll('.ops-status-tab').forEach(b => b.classList.toggle('active', b === btn));
  document.getElementById('flt-status').value = btn.dataset.status;
  applyFilters();
}

async function loadTasks() {
  const params = new URLSearchParams();
  const status = document.getElementById('flt-status').value;
  const priority = document.getElementById('flt-priority').value;
  const sort = document.getElementById('flt-sort').value;
  const my = document.getElementById('flt-my').checked;
  const q = document.getElementById('flt-search').value.trim();
  if (status)   params.set('status', status);
  if (priority) params.set('priority', priority);
  if (sort)     params.set('sort', sort);
  if (my)       params.set('my', '1');
  if (q)        params.set('q', q);

  const data = await OpsCommon.api('/api/operations/tasks?' + params);
  if (!data || !data.success) { OpsCommon.showError(data && data.error); return; }
  allTasks = data.tasks;
  allUsers = data.users;
  renderList();
}

// ── Task list rendering ──
function renderList() {
  const container = document.getElementById('task-list');
  OpsCommon.renderTaskList(container, allTasks, allUsers, meData && meData.user.id, loadTasks, {
    onTaskClick: openDetail,
    showComplete: false,
    showStart: false
  });
}

// ── Detail panel ──
async function openDetail(taskId) {
  const data = await OpsCommon.api('/api/operations/tasks/' + taskId);
  if (!data || !data.success) { OpsCommon.showError(data && data.error); return; }
  const task = data.task;
  allUsers = { ...allUsers, ...(data.users || {}) };
  const me = meData && meData.user;
  const myId = me && me.id;
  const myRole = me && me.role;

  const isAssignee = task.assigneeId === myId;
  const isDirector = myRole === 'DIRECTOR';
  const isCreator = task.createdBy === myId;
  const canEdit = isDirector || isCreator;
  const st = task.effectiveStatus || task.status;
  const assignee = allUsers[task.assigneeId] || {};
  const creator = allUsers[task.createdBy] || {};
  const pct = task.completionPercent || 0;
  const comments = Array.isArray(task.comments) ? task.comments : [];
  const history = Array.isArray(task.history) ? [...task.history].reverse() : [];
  const attachments = Array.isArray(task.attachments) ? task.attachments : [];

  // ─ Action buttons ─
  let actions = '';
  if (isAssignee && task.status === 'OPEN')
    actions += `<button class="btn btn-sm btn-neutral" onclick="doStart('${task.id}')">${t('ops.task.start')}</button>`;
  if (isAssignee && task.status !== 'COMPLETED' && task.status !== 'CANCELLED')
    actions += `<button class="btn btn-sm btn-ok" onclick="doComplete('${task.id}')">${t('ops.task.complete')}</button>`;
  if (canEdit && task.status !== 'CANCELLED')
    actions += `<button class="btn btn-sm btn-neutral" onclick="openEditMode('${task.id}')">✏️ ${t('ops.task.edit')}</button>`;
  if (canEdit && task.status !== 'CANCELLED')
    actions += `<button class="btn btn-sm btn-neutral" onclick="openReassignMode('${task.id}')">👤 ${t('ops.task.reassign')}</button>`;
  if (isDirector && task.status !== 'CANCELLED')
    actions += `<button class="btn btn-sm btn-danger" onclick="doCancel('${task.id}')">${t('ops.task.cancel')}</button>`;
  if (isDirector && task.status === 'CANCELLED')
    actions += `<button class="btn btn-sm btn-danger" onclick="doDeletePermanently('${task.id}')">${t('ops.task.deletePermanently')}</button>`;

  // ─ Progress control ─
  let progressHtml = '';
  const canProgress = isAssignee || canEdit;
  if (canProgress && task.status !== 'CANCELLED') {
    progressHtml = `
    <div class="panel-section">
      <div class="panel-section-title">${t('ops.task.progress')}</div>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        <div class="task-progress" style="flex:1;height:8px"><div class="progress-fill" id="pbar-fill" style="width:${pct}%"></div></div>
        <span id="pbar-val" style="font-weight:700;font-size:15px;min-width:38px;text-align:right">${pct}%</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <input type="range" id="pct-range" min="0" max="100" value="${pct}" style="flex:1"
               oninput="document.getElementById('pct-num').value=this.value;document.getElementById('pbar-fill').style.width=this.value+'%';document.getElementById('pbar-val').textContent=this.value+'%'">
        <input type="number" id="pct-num" min="0" max="100" value="${pct}" style="width:64px;padding:6px 8px;border:1.5px solid var(--border-l);border-radius:7px;font-size:14px"
               oninput="if(this.value>=0&&this.value<=100){document.getElementById('pct-range').value=this.value;document.getElementById('pbar-fill').style.width=this.value+'%';document.getElementById('pbar-val').textContent=this.value+'%'}">
        <button class="btn btn-sm btn-neutral" onclick="doProgress('${task.id}')">${t('ops.task.saveProgress')}</button>
      </div>
    </div>`;
  } else {
    progressHtml = pct > 0 ? `
    <div class="panel-section">
      <div class="panel-section-title">${t('ops.task.progress')}</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="task-progress" style="flex:1;height:8px"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span style="font-weight:700;font-size:15px">${pct}%</span>
      </div>
    </div>` : '';
  }

  // ─ History ─
  const histHtml = history.length ? history.map(h => `
    <div class="history-item">
      <div class="history-dot"></div>
      <div class="history-body">
        <div>${OpsCommon.historyLine(h)}</div>
        <div class="history-time">${OpsCommon.fmtDatetime(h.at)}${h.actorName ? ' · ' + esc(h.actorName) : ''}</div>
      </div>
    </div>`).join('') : `<div class="empty-state" style="padding:16px">${t('ops.task.noActivity')}</div>`;

  // ─ Comments ─
  const commentsHtml = comments.map(c => `
    <div class="comment-item">
      <span class="comment-author">${esc(c.authorName || '—')}</span>
      <span class="comment-time">${OpsCommon.fmtDatetime(c.createdAt)}</span>
      <div class="comment-text">${esc(c.text)}</div>
    </div>`).join('');

  // ─ Attachments ─
  const attUploadBar = canEdit && task.status !== 'CANCELLED' ? `
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button type="button" class="btn btn-sm btn-neutral" onclick="detailPickFile('${esc(task.id)}','image/jpeg,image/png,image/webp')">${t('ops.task.addPhoto')}</button>
      <button type="button" class="btn btn-sm btn-neutral" onclick="detailPickFile('${esc(task.id)}','application/pdf')">${t('ops.task.addPdf')}</button>
    </div>
    <input type="file" id="detail-file-input" style="display:none" onchange="detailOnFileSelected(this)">` : '';

  const attHtml = attUploadBar
    + (attachments.length
        ? attachments.map(a => _renderAttachment(a, task.id, canEdit)).join('')
        : `<p style="font-size:13px;color:var(--muted)">${t('ops.task.noAttachments')}</p>`);

  const reminderSection = canEdit && task.status !== 'CANCELLED' ? `
      <div class="panel-section">
        <div class="panel-section-title">${t('ops.task.reminderTitle')}</div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <select id="reminder-sel" class="form-select" style="max-width:200px">
            <option value="">${t('ops.task.reminderNone')}</option>
            <option value="1"${task.reminderDays===1?' selected':''}>${t('ops.task.reminder1d')}</option>
            <option value="2"${task.reminderDays===2?' selected':''}>${t('ops.task.reminder2d')}</option>
            <option value="3"${task.reminderDays===3?' selected':''}>${t('ops.task.reminder3d')}</option>
            <option value="7"${task.reminderDays===7?' selected':''}>${t('ops.task.reminder1w')}</option>
            <option value="custom"${task.reminderDays&&![1,2,3,7].includes(task.reminderDays)?' selected':''}>${t('ops.task.reminderCustom')}</option>
          </select>
          <input type="number" id="reminder-custom" class="form-input" min="1" max="365" placeholder="${t('ops.task.reminderDays')}" value="${task.reminderDays&&![1,2,3,7].includes(task.reminderDays)?task.reminderDays:''}" style="max-width:90px;display:${task.reminderDays&&![1,2,3,7].includes(task.reminderDays)?'':'none'}">
          <button class="btn btn-sm btn-neutral" onclick="doSetReminder('${esc(task.id)}')">${t('ops.task.saveProgress')}</button>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:6px 0 0">${task.reminderSentAt ? t('ops.task.reminderSent') : (task.reminderDays ? t('ops.task.reminderScheduled') : t('ops.task.reminderNoneActive'))}</p>
      </div>

      <div class="panel-section">
        <div class="panel-section-title">${t('ops.task.escalationTitle')}</div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px">
          <label style="display:flex;align-items:center;gap:6px;font-size:14px">
            <input type="checkbox" id="esc-enabled"${(task.escalation&&task.escalation.enabled)?' checked':''}>
            ${t('ops.task.escalationEnable')}
          </label>
        </div>
        <div id="esc-config" style="display:${task.escalation&&task.escalation.enabled?'':'none'}">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">
            <label style="font-size:13px">${t('ops.task.escalationWait')}</label>
            <input type="number" id="esc-after" class="form-input" min="0" max="720" value="${task.escalation?task.escalation.waitHoursAfterDue||24:24}" style="max-width:80px">
            <label style="font-size:13px">${t('ops.task.escalationHours')}</label>
            <input type="number" id="esc-between" class="form-input" min="0" max="720" value="${task.escalation?task.escalation.waitHoursBetweenLevels||24:24}" style="max-width:80px">
            <label style="font-size:13px">${t('ops.task.escalationHoursUnit')}</label>
          </div>
          <p style="font-size:12px;color:var(--muted);margin:0">${t('ops.task.escalationChain')}</p>
        </div>
        <button class="btn btn-sm btn-neutral" onclick="doSetEscalation('${esc(task.id)}')" style="margin-top:8px">${t('ops.task.saveEdit')}</button>
        ${task.escalationLevel > 0 ? `<p style="font-size:12px;color:var(--accent);margin:6px 0 0">${t('ops.task.escalationActive')} ${task.escalationLevel}</p>` : ''}
        <script>document.getElementById('esc-enabled').addEventListener('change',function(){document.getElementById('esc-config').style.display=this.checked?'':'none'});<\/script>
      </div>
      ` : '';

  document.getElementById('panel-inner').innerHTML = `
    <div class="panel-hdr">
      <div class="panel-hdr-title">${esc(task.title)}</div>
      <span class="badge badge-status-${st.toLowerCase()}" style="flex-shrink:0">${OpsCommon.statusLabel(st)}</span>
      <span class="badge badge-${task.priority.toLowerCase()}" style="flex-shrink:0">${OpsCommon.priorityLabel(task.priority)}</span>
      <button class="panel-close" onclick="closePanel()">${t('ops.task.closePanel')}</button>
    </div>
    <div class="panel-body">
      <div id="panel-msg"></div>

      ${actions ? `<div class="panel-section"><div class="action-row">${actions}</div></div>` : ''}

      ${progressHtml}

      <div class="panel-section">
        <div class="panel-section-title">${t('ops.task.detailsSection')}</div>
        <div class="info-grid">
          <div class="info-cell"><div class="info-cell-label">${t('ops.task.assignee')}</div><div class="info-cell-val">${esc(assignee.name || '—')} ${assignee.role ? '<small style="color:var(--muted)">('+OpsCommon.roleLabel(assignee.role)+')</small>' : ''}</div></div>
          <div class="info-cell"><div class="info-cell-label">${t('ops.task.createdBy')}</div><div class="info-cell-val">${esc(creator.name || task.createdByName || '—')}</div></div>
          <div class="info-cell"><div class="info-cell-label">${t('ops.task.dueDate')}</div><div class="info-cell-val">${esc(OpsCommon.fmtDue(task.dueDate))}</div></div>
          <div class="info-cell"><div class="info-cell-label">${t('ops.task.createdAt')}</div><div class="info-cell-val">${esc(OpsCommon.fmtDatetime(task.createdAt))}</div></div>
          ${task.startedAt ? `<div class="info-cell"><div class="info-cell-label">${t('ops.task.startedAt')}</div><div class="info-cell-val">${esc(OpsCommon.fmtDatetime(task.startedAt))}</div></div>` : ''}
          ${task.completedAt ? `<div class="info-cell"><div class="info-cell-label">${t('ops.task.completedAt')}</div><div class="info-cell-val">${esc(OpsCommon.fmtDatetime(task.completedAt))}</div></div>` : ''}
          ${task.department ? `<div class="info-cell"><div class="info-cell-label">${t('ops.task.department')}</div><div class="info-cell-val">${esc(task.department)}</div></div>` : ''}
          ${task.templateId ? `<div class="info-cell"><div class="info-cell-label">${t('ops.task.recurring')}</div><div class="info-cell-val">🔁 <small style="color:var(--muted)">ID template: ${esc(task.templateId.slice(-8))}</small></div></div>` : ''}
        </div>
        ${task.description ? `<div style="margin-top:10px;font-size:14px;line-height:1.55;color:var(--muted)">${esc(task.description)}</div>` : ''}
        ${task.notes ? `<div style="margin-top:10px;padding:10px;background:var(--bg);border-radius:8px;font-size:14px;line-height:1.5;white-space:pre-wrap">${esc(task.notes)}</div>` : ''}
      </div>

      ${reminderSection}

      <div class="panel-section">
        <div class="panel-section-title">${t('ops.task.attachments')} (${attachments.length})</div>
        ${attHtml}
      </div>

      <div class="panel-section">
        <div class="panel-section-title">${t('ops.task.comments')} (${comments.length})</div>
        ${commentsHtml}
        <div style="margin-top:12px">
          <textarea id="comment-text" class="form-textarea" maxlength="2000" placeholder="${t('ops.task.addComment')}" style="min-height:60px"></textarea>
          <button class="btn btn-sm btn-neutral" onclick="doComment('${task.id}')">${t('ops.task.sendComment')}</button>
        </div>
      </div>

      <details style="margin-bottom:16px">
        <summary style="cursor:pointer;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:10px">
          ${t('ops.task.historySection')} (${history.length})
        </summary>
        <div style="margin-top:12px">${histHtml}</div>
      </details>
    </div>`;

  openPanel();
  document.getElementById('side-panel').dataset.taskId = task.id;
  setTimeout(_loadDetailImages, 50);
}

// ── Create panel ──
function openCreatePanel() {
  const assigneeOptions = assignableUsers.map(u =>

// ── Panel open/close ──
function openPanel() {
  document.getElementById('side-panel').classList.add('open');
  document.getElementById('panel-overlay').classList.add('active');
}
function closePanel() {
  document.getElementById('side-panel').classList.remove('open');
  document.getElementById('panel-overlay').classList.remove('active');
  _pendingAttachments = [];
}

// ── [S6.4.1 rev2] Attachment helpers ─────────────────────────────────────────

function _attEndpointPath(taskId, attId) {
  return '/api/operations/tasks/' + encodeURIComponent(taskId)
       + '/attachments/' + encodeURIComponent(attId) + '/download';
}

async function _fetchBlobUrl(taskId, attId) {
  const tok = WsAuth.getStoredToken();
  const res = await fetch(_attEndpointPath(taskId, attId), {
    headers: tok ? { 'Authorization': 'Bearer ' + tok } : {}
  });
  if (!res.ok) return null;
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}

async function _downloadAttachment(taskId, attId, fileName) {
  const tok = WsAuth.getStoredToken();
  try {
    const res = await fetch(_attEndpointPath(taskId, attId),
      { headers: tok ? { 'Authorization': 'Bearer ' + tok } : {} });
    if (!res.ok) { panelMsg(t('ops.task.downloadError')); return; }
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = fileName || 'allegato';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  } catch (e) { panelMsg(t('ops.task.downloadError') + ': ' + e.message); }
}

async function _loadDetailImages() {
  const imgs = document.querySelectorAll('img.att-img-placeholder[data-src]');
  const tok  = WsAuth.getStoredToken();
  for (const img of imgs) {
    try {
      const res = await fetch(img.dataset.src,
        { headers: tok ? { 'Authorization': 'Bearer ' + tok } : {} });
      if (!res.ok) { img.alt = t('ops.task.imageError'); img.classList.remove('att-img-placeholder'); continue; }
      const blob = await res.blob();
      if (img.src && img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
      img.src = URL.createObjectURL(blob);
      img.classList.remove('att-img-placeholder');
    } catch { img.classList.remove('att-img-placeholder'); }
  }
}

function _fmtSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

// ── Create-panel attachment helpers ─

function c_pickFile(accept) {
  const inp = document.getElementById('c-file-input');
  if (!inp) return;
  inp.accept = accept;
  inp.value = '';
  inp.click();
}

function c_onFileSelected(inp) {
  const file = inp.files && inp.files[0];
  if (!file) return;
  if (_pendingAttachments.length >= 5) {
    panelMsg(t('ops.task.maxAttachments')); return;
  }
  _pendingAttachments.push({ file, tempId: 'tmp_' + Date.now() + '_' + Math.random().toString(36).slice(2) });
  c_renderFileList();
}

function c_removeFile(tempId) {
  _pendingAttachments = _pendingAttachments.filter(a => a.tempId !== tempId);
  c_renderFileList();
}

function c_renderFileList() {
  const el = document.getElementById('c-file-list');
  if (!el) return;
  el.innerHTML = _pendingAttachments.map(a => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:var(--bg);border-radius:6px;margin-bottom:4px;font-size:13px">
      <span>${esc(a.file.name)} <span style="color:var(--muted)">${_fmtSize(a.file.size)}</span></span>
      <button type="button" style="background:none;border:none;cursor:pointer;color:var(--danger);font-size:18px;line-height:1;padding:0 4px" onclick="c_removeFile('${esc(a.tempId)}')">×</button>
    </div>`).join('');
}

async function _uploadFile(taskId, file) {
  const tok = WsAuth.getStoredToken();
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch('/api/operations/tasks/' + encodeURIComponent(taskId) + '/attachments', {
      method: 'POST',
      headers: tok ? { 'Authorization': 'Bearer ' + tok } : {},
      body: fd
    });
    if (res.status === 401) {
      WsAuth.clearToken();
      alert(t('common.sessionExpired'));
      window.location.href = 'index.html';
      return { success: false, error: t('common.sessionExpired') };
    }
    return await res.json();
  } catch (e) {
    return { success: false, error: t('common.networkError') + ': ' + e.message };
  }
}

// ── Detail-panel attachment helpers ─

function _renderAttachment(a, taskId, canEdit) {
  const endpointPath = _attEndpointPath(taskId, a.id);
  const isImage = a.contentType && a.contentType.startsWith('image/');
  const isPdf   = a.contentType === 'application/pdf';
  const rawName = a.fileName || a.filename || 'file';
  const name    = esc(rawName);
  const sizeStr = _fmtSize(a.size);
  const meta    = [
    OpsCommon.fmtDatetime(a.uploadedAt),
    a.uploadedByName ? esc(a.uploadedByName) : null,
    sizeStr || null
  ].filter(Boolean).join(' · ');

  const preview = isImage
    ? `<img data-src="${endpointPath}" class="att-img-placeholder" alt="${name}"
          onclick="if(this.src&&this.src.startsWith('blob:'))window.open(this.src,'_blank')"
          style="max-width:100%;max-height:160px;object-fit:contain;border-radius:6px;display:block;margin-bottom:6px;cursor:pointer;background:#f0f0f0">`
    : isPdf
    ? `<span style="font-size:24px;margin-right:4px">📄</span>`
    : `<span style="font-size:24px;margin-right:4px">📎</span>`;

  const deleteBtn = canEdit
    ? `<button class="btn btn-sm btn-danger" style="flex-shrink:0"
          onclick="doDeleteAttachment('${esc(taskId)}','${esc(a.id)}')">🗑</button>` : '';

  const dlLink = `<a href="#" onclick="event.preventDefault();_downloadAttachment('${esc(taskId)}','${esc(a.id)}',${JSON.stringify(rawName)})"
      style="font-weight:600;font-size:13px;color:var(--accent);text-decoration:none;word-break:break-all">${name}</a>`;

  return `<div style="padding:8px 0;border-bottom:1px solid var(--border-l)">
    ${isImage ? preview : ''}
    <div style="display:flex;align-items:center;gap:8px">
      ${isImage ? '' : preview}
      <div style="flex:1;min-width:0">
        ${dlLink}
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${meta}</div>
      </div>
      ${deleteBtn}
    </div>
  </div>`;
}

function detailPickFile(taskId, accept) {
  const inp = document.getElementById('detail-file-input');
  if (!inp) return;
  inp.dataset.taskId = taskId;
  inp.accept = accept;
  inp.value = '';
  inp.click();
}

async function detailOnFileSelected(inp) {
  const file   = inp.files && inp.files[0];
  const taskId = inp.dataset.taskId;
  if (!file || !taskId) return;
  const msgEl = document.getElementById('panel-msg');
  if (msgEl) { msgEl.textContent = t('ops.task.uploadProgress'); msgEl.className = 'msg msg-info'; msgEl.style.display = 'block'; }
  const r = await _uploadFile(taskId, file);
  if (r && r.success) {
    panelMsg(t('ops.task.attachmentAdded'), 'success');
    await loadTasks();
    openDetail(taskId);
  } else {
    panelMsg((r && r.error) || t('common.error'));
  }
}

async function doDeleteAttachment(taskId, attId) {
  if (!confirm(t('ops.task.confirmDeleteAttachment'))) return;
  const r = await OpsCommon.api('/api/operations/tasks/' + taskId + '/attachments/' + attId, { method: 'DELETE' });
  if (r && r.success) {
    await loadTasks();
    openDetail(taskId);
  } else {
    panelMsg((r && r.error) || t('common.error'));
  }
}

// ── Panel message helper ──
function panelMsg(msg, type = 'error') {
  const el = document.getElementById('panel-msg');
  if (!el) return;
  el.textContent = msg;
  el.className = 'msg msg-' + type;
  el.style.display = 'block';
  if (type !== 'error') setTimeout(() => { if (el) el.style.display = 'none'; }, 3000);
}

// ── Action handlers ──
async function doCreate() {
  const btn = document.getElementById('c-btn');
  btn.disabled = true;
  const body = {
    title:       document.getElementById('c-title').value.trim(),
    description: document.getElementById('c-desc').value.trim(),
    assigneeId:  document.getElementById('c-assignee').value,
    priority:    document.getElementById('c-priority').value,
    dueDate:     document.getElementById('c-due').value || null,
    department:  document.getElementById('c-dept').value.trim() || null
  };
  if (!body.title) { panelMsg(t('ops.task.titleRequired')); btn.disabled = false; return; }

  const r = await OpsCommon.api('/api/operations/tasks', { method: 'POST', body: JSON.stringify(body) });
  btn.disabled = false;
  if (!r || !r.success) { panelMsg((r && r.error) || t('common.error')); return; }

  const taskId  = r.task.id;
  const pending = _pendingAttachments.splice(0);
  const errors  = [];
  for (const att of pending) {
    const ur = await _uploadFile(taskId, att.file);
    if (!ur || !ur.success) errors.push(esc(att.file.name) + ': ' + ((ur && ur.error) || t('common.error')));
  }

  await loadTasks();
  if (errors.length) {
    panelMsg(t('ops.task.createdMsg') + ' ' + errors.join('; '), 'error');
    setTimeout(() => openDetail(taskId), 1200);
  } else {
    panelMsg(t('ops.task.createdMsg'), 'success');
    setTimeout(() => openDetail(taskId), 500);
  }
}

async function doEdit(taskId) {
  const btn = document.getElementById('e-btn');
  btn.disabled = true;
  const body = {
    title: document.getElementById('e-title').value.trim(),
    description: document.getElementById('e-desc').value.trim(),
    priority: document.getElementById('e-priority').value,
    dueDate: document.getElementById('e-due').value || null,
    department: document.getElementById('e-dept').value.trim() || null,
    notes: document.getElementById('e-notes').value.trim()
  };
  const r = await OpsCommon.api('/api/operations/tasks/' + taskId, { method: 'PATCH', body: JSON.stringify(body) });
  btn.disabled = false;
  if (r && r.success) {
    await loadTasks();
    openDetail(taskId);
  } else {
    panelMsg((r && r.error) || t('common.error'));
  }
}

async function doReassign(taskId) {
  const btn = document.getElementById('ra-btn');
  btn.disabled = true;
  const assigneeId = document.getElementById('ra-assignee').value;
  const r = await OpsCommon.api('/api/operations/tasks/' + taskId + '/reassign', {
    method: 'POST', body: JSON.stringify({ assigneeId })
  });
  btn.disabled = false;
  if (r && r.success) {
    await loadTasks();
    openDetail(taskId);
  } else {
    panelMsg((r && r.error) || t('ops.task.reassignError'));
  }
}

async function doStart(taskId) {
  const r = await OpsCommon.api('/api/operations/tasks/' + taskId + '/start', { method: 'POST' });
  if (r && r.success) { await loadTasks(); openDetail(taskId); }
  else panelMsg((r && r.error) || t('common.error'));
}

async function doComplete(taskId) {
  if (!confirm(t('ops.task.confirmComplete'))) return;
  const r = await OpsCommon.api('/api/operations/tasks/' + taskId + '/complete', { method: 'POST' });
  if (r && r.success) { await loadTasks(); openDetail(taskId); }
  else panelMsg((r && r.error) || t('common.error'));
}

async function doProgress(taskId) {
  const pct = parseInt(document.getElementById('pct-num').value, 10);
  if (isNaN(pct) || pct < 0 || pct > 100) { panelMsg(t('ops.task.invalidRange')); return; }
  const r = await OpsCommon.api('/api/operations/tasks/' + taskId + '/progress', {
    method: 'POST', body: JSON.stringify({ completionPercent: pct })
  });
  if (r && r.success) { await loadTasks(); openDetail(taskId); }
  else panelMsg((r && r.error) || t('common.error'));
}

async function doCancel(taskId) {
  const reason = prompt(t('ops.task.cancelReason')) ?? '';
  if (reason === null) return;
  const r = await OpsCommon.api('/api/operations/tasks/' + taskId + '/cancel', {
    method: 'POST', body: JSON.stringify({ reason })
  });
  if (r && r.success) { await loadTasks(); openDetail(taskId); }
  else panelMsg((r && r.error) || t('common.error'));
}

// ── Permanent hard-delete ────────────────────────────────────────────
let _delPermTaskId = null;
function doDeletePermanently(taskId) {
  _delPermTaskId = taskId;
  // Apply current language to modal labels
  I18n.apply(document.getElementById('del-perm-modal'));
  document.getElementById('del-perm-overlay').style.display = '';
  document.getElementById('del-perm-modal').style.display = '';
}
function closeDelPerm() {
  _delPermTaskId = null;
  document.getElementById('del-perm-overlay').style.display = 'none';
  document.getElementById('del-perm-modal').style.display = 'none';
}
async function confirmDeletePermanently() {
  if (!_delPermTaskId) return;
  const taskId = _delPermTaskId;
  closeDelPerm();
  const r = await OpsCommon.api('/api/operations/tasks/' + taskId, { method: 'DELETE' });
  if (r && r.success) {
    closePanel();
    await loadTasks();
  } else {
    panelMsg((r && r.error) || t('common.error'));
  }
}

async function doComment(taskId) {
  const text = (document.getElementById('comment-text').value || '').trim();
  if (!text) { panelMsg(t('ops.task.commentRequired')); return; }
  const r = await OpsCommon.api('/api/operations/tasks/' + taskId + '/comments', {
    method: 'POST', body: JSON.stringify({ text })
  });
  if (r && r.success) { await loadTasks(); openDetail(taskId); }
  else panelMsg((r && r.error) || t('common.error'));
}

// ── Sprint 3: Reminder ──
async function doSetReminder(taskId) {
  const sel = document.getElementById('reminder-sel');
  const customEl = document.getElementById('reminder-custom');
  let days = null;
  if (sel.value === 'custom') {
    days = Number(customEl.value);
    if (!days || days < 1) { panelMsg('Inserisci un numero di giorni valido.'); return; }
  } else if (sel.value) {
    days = Number(sel.value);
  }
  const r = await OpsCommon.api('/api/operations/tasks/' + taskId + '/reminder', {
    method: 'PATCH', body: JSON.stringify({ reminderDays: days })
  });
  if (r && r.success) { panelMsg(t('ops.task.reminderSaved'), 'success'); await loadTasks(); setTimeout(() => openDetail(taskId), 500); }
  else panelMsg((r && r.error) || t('common.error'));
}

// ── Sprint 3: Escalation ──
async function doSetEscalation(taskId) {
  const enabled       = document.getElementById('esc-enabled').checked;
  const waitAfter     = Number(document.getElementById('esc-after') && document.getElementById('esc-after').value) || 24;
  const waitBetween   = Number(document.getElementById('esc-between') && document.getElementById('esc-between').value) || 24;
  const r = await OpsCommon.api('/api/operations/tasks/' + taskId + '/escalation', {
    method: 'PATCH', body: JSON.stringify({ enabled, waitHoursAfterDue: waitAfter, waitHoursBetweenLevels: waitBetween })
  });
  if (r && r.success) { panelMsg(t('ops.task.escalationSaved'), 'success'); await loadTasks(); setTimeout(() => openDetail(taskId), 500); }
  else panelMsg((r && r.error) || t('common.error'));
}

OpsRealtime.on('OPS_TASK_COMPLETED',  () => { rtReload(400); OpsRealtime.toast(t('ops.rt.taskCompleted'), 'ok'); });
OpsRealtime.on('OPS_TASK_REASSIGNED', () => { rtReload(400); OpsRealtime.toast(t('ops.rt.taskReassigned'), 'info'); });
OpsRealtime.on('OPS_TASK_PROGRESS',   () => { rtReload(500); });
OpsRealtime.on('OPS_COMMENT_ADDED',   () => { rtReload(500); });
OpsRealtime.on('OPS_USER_SUSPENDED',  () => { rtReload(600); });
OpsRealtime.on('OPS_USER_ARCHIVED',   () => { rtReload(600); });
OpsRealtime.on('OPS_USER_RESTORED',   () => { rtReload(600); });
OpsRealtime.on('OPS_TASK_DELETED',    () => { closePanel(); rtReload(300); });
</script>
