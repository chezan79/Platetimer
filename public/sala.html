<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servizio — PlateTimer</title>
<style>
:root {
  --bg:       #F1F5F9;
  --panel:    #FFFFFF;
  --card:     #FFFFFF;
  --card-h:   #F8FAFC;
  --border:   #E2E8F0;
  --border-l: #CBD5E1;
  --text:     #0F172A;
  --muted:    #64748B;
  --accent:   #4F46E5;
  --accent2:  #6366F1;
  --warn:     #D97706;
  --danger:   #DC2626;
  --ok:       #16A34A;
  --hdr:      56px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden;}

/* ── HEADER ─────────────────────────────── */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);
  background:rgba(13,13,26,.96);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 16px;z-index:200;}
.hdr-brand{font-size:15px;font-weight:700;color:var(--accent2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.hdr-sep{width:1px;height:20px;background:var(--border-l);flex-shrink:0;}
.hdr-page{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;flex:1;}
.conn-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;
  background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3);
  white-space:nowrap;flex-shrink:0;transition:all .3s;}
.conn-badge.ok{background:rgba(34,197,94,.12);color:var(--ok);border-color:rgba(34,197,94,.3);}
.hdr-btn{padding:7px 14px;border:1px solid var(--border-l);border-radius:7px;
  background:rgba(255,255,255,.06);color:var(--text);font-size:13px;cursor:pointer;
  white-space:nowrap;flex-shrink:0;transition:background .15s;}
.hdr-btn:hover{background:rgba(255,255,255,.12);}
.hdr-btn.danger{border-color:rgba(239,68,68,.3);color:var(--danger);}
.hdr-btn.danger:hover{background:rgba(239,68,68,.1);}

/* ── MAIN ───────────────────────────────── */
.main{max-width:1200px;margin:0 auto;padding:calc(var(--hdr) + 20px) 16px 40px;}

/* ── STATS ROW ──────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:600px){.stats-row{grid-template-columns:1fr;}}
.stat-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;
  padding:16px 18px;text-align:center;}
.stat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);margin-bottom:6px;}
.stat-value{font-size:28px;font-weight:800;color:var(--accent2);line-height:1;}

/* ── FILTERS ────────────────────────────── */
.filters-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px;}
.search-input{flex:1;min-width:180px;padding:9px 14px;
  background:rgba(255,255,255,.05);border:1.5px solid var(--border-l);
  border-radius:9px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s;}
.search-input::placeholder{color:var(--muted);}
.search-input:focus{border-color:var(--accent);}
.filter-group{display:flex;gap:6px;flex-wrap:wrap;}
.filter-btn{padding:7px 14px;border:1.5px solid var(--border-l);
  background:rgba(255,255,255,.05);border-radius:8px;color:var(--muted);
  cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;}
.filter-btn:hover{background:rgba(255,255,255,.1);color:var(--text);}
.filter-btn.active{background:rgba(99,102,241,.2);border-color:var(--accent);color:var(--accent2);}

/* ── SECTION HEADER ─────────────────────── */
.section-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.section-title{font-size:14px;font-weight:700;text-transform:uppercase;
  letter-spacing:.6px;color:var(--muted);}
.section-count{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;
  background:rgba(99,102,241,.15);color:var(--accent2);border:1px solid rgba(99,102,241,.3);}

/* ── COUNTDOWN CARDS ────────────────────── */
.cd-list{display:flex;flex-direction:column;gap:10px;}

.cd-card{background:var(--card);border:1.5px solid var(--border);border-radius:13px;
  padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  transition:border-color .2s;}
.cd-card:hover{border-color:var(--border-l);}

.cd-card.warning{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.05);}
.cd-card.critical{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.07);
  animation:pulse 2s ease-in-out infinite;}
.cd-card.expired{border-color:rgba(239,68,68,.9);background:rgba(239,68,68,.09);
  animation:blink-expired .7s ease-in-out infinite;}
@keyframes blink-expired{0%,100%{opacity:1;border-color:rgba(239,68,68,.9);}50%{opacity:.3;border-color:rgba(239,68,68,.15);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.75;}}

/* Table number */
.cd-table{font-size:22px;font-weight:800;color:var(--text);
  min-width:52px;text-align:center;flex-shrink:0;}

/* Stations */
.cd-stations{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:120px;}
.station-badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;
  background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border-l);}

/* Time */
.cd-time{font-size:26px;font-weight:800;min-width:72px;text-align:right;flex-shrink:0;
  font-variant-numeric:tabular-nums;}
.cd-time.neutral{color:var(--ok);}
.cd-time.warning{color:var(--warn);}
.cd-time.critical{color:var(--danger);}

/* Meta */
.cd-meta{display:flex;flex-direction:column;gap:3px;min-width:90px;flex-shrink:0;}
.cd-meta-row{font-size:11px;color:var(--muted);}
.cd-meta-row strong{color:var(--text);font-weight:600;}

/* Status badge */
.status-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;
  white-space:nowrap;flex-shrink:0;}
.status-badge.active{background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.25);}
.status-badge.alert{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.25);}

/* Empty state */
.empty-state{text-align:center;padding:70px 20px;color:var(--muted);}
.empty-state-icon{font-size:56px;margin-bottom:16px;}
.empty-state-text{font-size:16px;}

/* ── MOBILE ─────────────────────────────── */
@media(max-width:600px){
  .cd-card{gap:10px;}
  .cd-meta{display:none;}
  .cd-time{font-size:22px;}
  .hdr-brand{max-width:120px;}
}

/* ── LIGHT THEME OVERRIDES ─────────────────────────────── */
.hdr{background:rgba(255,255,255,.97);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.hdr-btn{background:rgba(0,0,0,.04);color:var(--text);border-color:var(--border-l);}
.hdr-btn:hover{background:rgba(0,0,0,.09);}
.hdr-btn.danger{border-color:rgba(220,38,38,.35);color:var(--danger);}
.hdr-btn.danger:hover{background:rgba(220,38,38,.08);}
.hdr-btn.voice-active{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:var(--danger);}

/* ── VOICE PANEL ─────────────────────────── */
.voice-panel{position:fixed;top:var(--hdr);right:0;width:300px;max-height:calc(100vh - var(--hdr));
  overflow-y:auto;background:#fff;border-left:1.5px solid var(--border);
  border-bottom:1.5px solid var(--border);border-bottom-left-radius:12px;
  box-shadow:-4px 4px 20px rgba(0,0,0,.1);z-index:190;
  display:none;padding:16px;}
.voice-panel.open{display:block;}
.vp-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);margin-bottom:10px;}
.vp-section{margin-bottom:14px;}
.vp-dest-all{display:flex;align-items:center;gap:8px;padding:7px 10px;
  border-radius:7px;background:rgba(79,70,229,.06);border:1.5px solid rgba(79,70,229,.15);
  cursor:pointer;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--accent);}
.vp-dest-all input{accent-color:var(--accent);}
.di{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;
  border:1.5px solid var(--border);cursor:pointer;margin-bottom:4px;font-size:13px;
  transition:all .15s;}
.di:hover{background:rgba(0,0,0,.03);}
.di.sel{background:rgba(79,70,229,.08);border-color:var(--accent);}
.di label{cursor:pointer;flex:1;}
.di input{accent-color:var(--accent);}
.voice-btn-main{width:100%;padding:10px;border:none;border-radius:8px;
  background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;
  transition:background .15s;margin-top:4px;}
.voice-btn-main:disabled{background:#94a3b8;cursor:not-allowed;}
.voice-btn-main.recording{background:var(--danger);}
.voice-status{font-size:12px;color:var(--muted);margin-top:6px;min-height:18px;text-align:center;}
.no-depts{font-size:13px;color:var(--muted);}

/* ── INCOMING VOICE MESSAGES ─────────────── */
.vm-section{margin-top:20px;}
.vm-item{background:#fff;border:1.5px solid var(--border);border-radius:10px;
  padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.vm-from{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;}
.vm-audio{flex:1;height:36px;}
.vm-dismiss{border:none;background:none;cursor:pointer;color:var(--muted);font-size:16px;
  padding:2px 6px;border-radius:4px;transition:color .15s;}
.vm-dismiss:hover{color:var(--danger);}
/* Search input (was rgba(255,255,255,.05) — invisible on white) */
.search-input{background:white;color:var(--text);}
.search-input::placeholder{color:var(--muted);}
/* Filter buttons */
.filter-btn{background:rgba(0,0,0,.04);color:var(--text);}
.filter-btn:hover{background:rgba(0,0,0,.08);color:var(--text);}
.filter-btn.active{background:rgba(79,70,229,.1);border-color:var(--accent);color:var(--accent);}
/* Stat cards get a subtle shadow */
.stat-card{box-shadow:0 1px 3px rgba(0,0,0,.06);}
/* Station badge (was rgba(255,255,255,.08) — invisible on white) */
.station-badge{background:rgba(0,0,0,.06);color:var(--text);border-color:var(--border-l);}
/* Countdown card warning/critical states on light background */
.cd-card.warning{border-color:var(--warn);background:#FFFBEB;}
.cd-card.critical{border-color:var(--danger);background:#FFF5F5;}
.cd-card.expired{border-color:var(--danger);background:#FFF5F5;}
/* Alert badge adjusted for light bg */
.status-badge.alert{color:var(--danger);background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.2);}
</style>
</head>
<body>

<!-- ── HEADER ─────────────────────────── -->
<header class="hdr">
  <span id="hdr-company" class="hdr-brand">Servizio</span>
  <span class="hdr-sep"></span>
  <span class="hdr-page" data-i18n="sala.title">Servizio</span>
  <span id="connectionStatus" class="conn-badge">🔴 Riconnessione…</span>
  <button id="voice-toggle-btn" class="hdr-btn" onclick="toggleVoicePanel()" title="Messaggi vocali" data-i18n="sala.voiceBtn">🎙️ Vocale</button>
  <span id="i18n-sala-sel"></span>
  <button class="hdr-btn" onclick="window.location.href='home.html'" data-i18n="common.home">Home</button>
  <button class="hdr-btn danger" onclick="window.location.href='index.html'" data-i18n="common.logout">Esci</button>
</header>

<!-- ── VOICE PANEL ──────────────────────── -->
<div id="voice-panel" class="voice-panel">
  <div class="vp-title" data-i18n="sala.sendVoice">📤 Invia messaggio vocale</div>

  <div class="vp-section">
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;" data-i18n="sala.sendTo">INVIA A</div>
    <!-- "All departments" shortcut -->
    <div class="vp-dest-all" onclick="toggleAllDepts()">
      <input type="checkbox" id="vchk-all" onclick="event.stopPropagation()">
      <label for="vchk-all" style="cursor:pointer;" data-i18n="sala.allDepts">Tutti i reparti</label>
    </div>
    <div id="voice-dest-list"><div class="no-depts" data-i18n="sala.loadingDepts">Caricamento reparti…</div></div>
  </div>

  <div class="vp-section">
    <button id="voice-btn" class="voice-btn-main" onclick="toggleRec()" disabled data-i18n="sala.startRecording">🎙️ Avvia registrazione</button>
    <div id="voice-status-txt" class="voice-status" data-i18n="sala.noSelRecipient">Seleziona destinatario</div>
  </div>
</div>

<!-- ── MAIN ───────────────────────────── -->
<main class="main">

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label" data-i18n="sala.activeCountdowns">Countdown Attivi</div>
      <div class="stat-value" id="activeCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label" data-i18n="sala.avgWaitTime">Tempo Medio Attesa</div>
      <div class="stat-value" id="avgTime">0:00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label" data-i18n="sala.tablesWaiting">Tavoli in Attesa</div>
      <div class="stat-value" id="tableCount">0</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cerca tavolo…">
    <div class="filter-group" id="filter-group">
      <button class="filter-btn active" data-filter="all" data-i18n="sala.all">Tutti</button>
    </div>
  </div>

  <!-- List -->
  <div class="section-hdr">
    <span class="section-title" data-i18n="sala.countdownsTitle">Countdown attivi</span>
    <span class="section-count" id="visibleCount">0</span>
  </div>
  <div class="cd-list" id="countdownsList"></div>

  <!-- Incoming voice messages (hidden until a message arrives) -->
  <div id="voice-msgs-section" class="vm-section" style="display:none;">
    <div class="section-hdr">
      <span class="section-title" data-i18n="sala.voiceMessages">📥 Messaggi vocali ricevuti</span>
      <span class="section-count" id="voice-msg-count">0</span>
    </div>
    <div id="voice-msg-list"></div>
  </div>

</main>

<audio id="snd-warn"   src="alerte-346112.mp3"           preload="auto"></audio>
<audio id="snd-expiry" src="costa-rica-eas-alarm-346194.mp3" preload="auto"></audio>

<script src="js/i18n.js"></script>
<script src="js/ws-auth.js"></script>
<script src="js/countdowns.js"></script>
<script src="company-header.js"></script>
<script>
    const _t = k => window.I18n ? window.I18n.t(k) : k;
    let countdowns = [];
    let activeFilter = 'all';
    let searchTerm = '';
    let subscription = null;
    let updateInterval = null;

    // ── Virtual sala ID (voice endpoint) ────────────────────────────────────
    // This constant is shared with the server — never change it without updating server.js.
    const SALA_ID = '__sala__';

    // ── Alarm audio ─────────────────────────────────────────────────────────
    let _audioUnlocked = false;
    function _unlockAudio() {
        if (_audioUnlocked) return;
        _audioUnlocked = true;
        ['snd-warn','snd-expiry'].forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            el.muted = true;
            el.play().then(() => { el.pause(); el.muted = false; el.currentTime = 0; }).catch(() => {});
        });
        // Also drain any queued voice messages waiting for user gesture.
        const banner = document.getElementById('audio-unlock-banner');
        if (banner) banner.remove();
        if (!_vmPlaying && _vmQueue.length) _vmPlayNext();
    }
    ['pointerdown','keydown'].forEach(ev =>
        document.addEventListener(ev, _unlockAudio, { once: true })
    );
    function playAlarm(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.currentTime = 0;
        el.play().catch(err => console.warn('[alarm] play blocked:', err.message));
    }

    // ── Voice auto-play queue ────────────────────────────────────────────────
    let _vmQueue   = [];
    let _vmPlaying = false;

    function _vmEnqueuePlay(blobUrl) {
        if (!blobUrl) return;
        _vmQueue.push(blobUrl);
        if (!_vmPlaying) _vmPlayNext();
    }
    function _vmPlayNext() {
        if (_vmQueue.length === 0) { _vmPlaying = false; return; }
        _vmPlaying = true;
        const url = _vmQueue.shift();
        const audio = new Audio(url);
        audio.onended = () => _vmPlayNext();
        audio.onerror = () => { console.warn('[voice] playback error, skipping'); _vmPlayNext(); };
        audio.play().catch(err => {
            console.warn('[voice] autoplay blocked:', err.message);
            _vmQueue.unshift(url);
            _vmPlaying = false;
            _showAudioUnlockBanner();
        });
    }
    function _showAudioUnlockBanner() {
        if (document.getElementById('audio-unlock-banner')) return;
        const banner = document.createElement('div');
        banner.id = 'audio-unlock-banner';
        banner.style.cssText = [
            'position:fixed','bottom:20px','left:50%','transform:translateX(-50%)',
            'z-index:9999','background:#1e3a5f','color:#fff',
            'padding:12px 20px','border-radius:10px',
            'box-shadow:0 4px 20px rgba(0,0,0,.45)',
            'display:flex','align-items:center','gap:12px',
            'font-size:14px','font-family:inherit'
        ].join(';');
        banner.innerHTML =
            '<span>🔊 Attiva audio per i messaggi vocali</span>' +
            '<button id="audio-unlock-btn" style="background:#3b82f6;color:#fff;border:none;' +
            'border-radius:6px;padding:7px 16px;cursor:pointer;font-size:13px;font-family:inherit;">' +
            'Attiva audio</button>';
        document.body.appendChild(banner);
        document.getElementById('audio-unlock-btn').addEventListener('click', () => {
            banner.remove();
            _audioUnlocked = true;
            if (!_vmPlaying && _vmQueue.length) _vmPlayNext();
        }, { once: true });
    }

    // ── Voice panel toggle ───────────────────────────────────────────────────
    let _voicePanelOpen = false;
    function toggleVoicePanel() {
        _voicePanelOpen = !_voicePanelOpen;
        document.getElementById('voice-panel').classList.toggle('open', _voicePanelOpen);
        document.getElementById('voice-toggle-btn').classList.toggle('voice-active', _voicePanelOpen);
    }

    // ── Voice send state ─────────────────────────────────────────────────────
    let voiceDests           = new Set();
    let mediaRec             = null;
    let audioChunks          = [];
    let isRecording          = false;
    let currentVoiceState    = 'idle';
    let recAutoStopTimer     = null;
    let recCountdownInterval = null;
    let voiceMessages        = new Map(); // messageId → { id, fromName, timestamp, blobUrl }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload  = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    function getSupportedMimeType() {
        if (!window.MediaRecorder) return '';
        const types = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
        for (const t of types) { if (MediaRecorder.isTypeSupported(t)) return t; }
        return '';
    }

    function setVoiceState(state) {
        currentVoiceState = state;
        const btn = document.getElementById('voice-btn');
        const sts = document.getElementById('voice-status-txt');
        if (!btn) return;
        btn.classList.toggle('recording', state === 'recording');
        if (state === 'recording') { btn.textContent = _t('sala.recording'); }
        else if (state === 'sending') { btn.textContent = _t('sala.sending'); btn.disabled = true; }
        else if (state === 'done') {
            btn.textContent = _t('sala.sent');
            btn.disabled = true;
            if (sts) sts.textContent = _t('sala.messageSent');
            setTimeout(() => setVoiceState('idle'), 2500);
        } else if (state === 'failed') {
            btn.textContent = _t('sala.failed');
        } else { // idle
            btn.textContent = _t('sala.startRecording');
            refreshVoiceBtn();
        }
    }

    // ── Voice destination list ───────────────────────────────────────────────
    function buildVoiceDestList() {
        const others = Object.values(departmentMap).filter(d => d.active);
        const el = document.getElementById('voice-dest-list');
        if (!el) return;
        if (!others.length) {
            el.innerHTML = `<div class="no-depts">${_t('sala.noDepts')}</div>`;
            return;
        }
        el.innerHTML = others.map(d => `
            <div class="di" id="vdi-${d.id}" onclick="toggleVoiceDest('${d.id}')">
              <input type="checkbox" id="vchk-${d.id}" onclick="event.stopPropagation()">
              <label for="vchk-${d.id}">${esc(d.name)}</label>
            </div>`).join('');
        others.forEach(d => {
            document.getElementById(`vchk-${d.id}`).addEventListener('change', e => {
                e.stopPropagation();
                toggleVoiceDestById(d.id, e.target.checked);
            });
        });
    }

    function toggleVoiceDest(id) { toggleVoiceDestById(id, !voiceDests.has(id)); }
    function toggleVoiceDestById(id, on) {
        if (on) voiceDests.add(id); else voiceDests.delete(id);
        const item = document.getElementById(`vdi-${id}`);
        const chk  = document.getElementById(`vchk-${id}`);
        if (item) item.classList.toggle('sel', on);
        if (chk)  chk.checked = on;
        // Sync "all" checkbox
        const allIds = Object.values(departmentMap).filter(d => d.active).map(d => d.id);
        const allChk = document.getElementById('vchk-all');
        if (allChk) allChk.checked = allIds.length > 0 && allIds.every(i => voiceDests.has(i));
        refreshVoiceBtn();
    }

    function toggleAllDepts() {
        const allIds = Object.values(departmentMap).filter(d => d.active).map(d => d.id);
        const allChk = document.getElementById('vchk-all');
        const selectAll = allChk ? !allChk.checked : true; // toggle
        if (allChk) allChk.checked = selectAll;
        allIds.forEach(id => toggleVoiceDestById(id, selectAll));
    }

    function refreshVoiceBtn() {
        const btn = document.getElementById('voice-btn');
        if (!btn) return;
        const locked = currentVoiceState === 'sending' || currentVoiceState === 'done';
        btn.disabled = locked || (!isRecording && voiceDests.size === 0);
        if (!locked && !isRecording) {
            const sts = document.getElementById('voice-status-txt');
            if (sts) sts.textContent = voiceDests.size === 0 ? _t('sala.noSelRecipient') : `${voiceDests.size} ${_t('sala.selectedDepts')}`;
        }
    }

    // ── Recording ────────────────────────────────────────────────────────────
    const MAX_REC_SECONDS = 5;

    async function toggleRec() {
        if (!isRecording) { await startRec(); } else { stopRec(); }
    }

    async function startRec() {
        const sts = document.getElementById('voice-status-txt');
        if (voiceDests.size === 0) {
            if (sts) sts.textContent = _t('sala.selectAtLeastOne');
            return;
        }
        if (!navigator.mediaDevices || !window.MediaRecorder) {
            if (sts) sts.textContent = _t('sala.recNotSupported');
            setVoiceState('failed');
            setTimeout(() => setVoiceState('idle'), 4000);
            return;
        }
        try {
            const stream   = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mimeType = getSupportedMimeType();
            audioChunks    = [];
            mediaRec       = mimeType
                ? new MediaRecorder(stream, { mimeType })
                : new MediaRecorder(stream);
            mediaRec.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
            mediaRec.onstop = sendVoiceMsg;
            mediaRec.start();
            isRecording = true;
            setVoiceState('recording');

            let secondsLeft = MAX_REC_SECONDS;
            if (sts) sts.textContent = `Registrazione… ${secondsLeft}s`;
            recCountdownInterval = setInterval(() => {
                secondsLeft--;
                if (sts) sts.textContent = secondsLeft > 0
                    ? `Registrazione… ${secondsLeft}s` : 'Invio automatico…';
            }, 1000);
            recAutoStopTimer = setTimeout(() => stopRec(), MAX_REC_SECONDS * 1000);
        } catch (e) {
            console.error('[voice] mic error:', e);
            const msg = (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError')
                ? 'Accesso microfono negato.' : 'Errore microfono.';
            const sts2 = document.getElementById('voice-status-txt');
            if (sts2) sts2.textContent = msg;
            setVoiceState('failed');
            setTimeout(() => setVoiceState('idle'), 4000);
        }
    }

    function stopRec() {
        clearInterval(recCountdownInterval);
        clearTimeout(recAutoStopTimer);
        recCountdownInterval = null;
        recAutoStopTimer = null;
        if (mediaRec && isRecording) {
            mediaRec.stop();
            mediaRec.stream.getTracks().forEach(t => t.stop());
            isRecording = false;
            setVoiceState('sending');
        }
    }

    async function sendVoiceMsg() {
        try {
            const actualMime = (mediaRec && mediaRec.mimeType) ? mediaRec.mimeType : 'audio/webm';
            const blob = new Blob(audioChunks, { type: actualMime });
            if (blob.size > 6_000_000) {
                const sts = document.getElementById('voice-status-txt');
                if (sts) sts.textContent = 'Messaggio troppo lungo.';
                setVoiceState('failed');
                setTimeout(() => setVoiceState('idle'), 4000);
                return;
            }
            const b64   = await blobToBase64(blob);
            const msgId = 'vm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            const tk    = WsAuth.getStoredToken();
            const resp  = await fetch('/api/voice-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${tk}` },
                body: JSON.stringify({
                    audioData:    b64,
                    messageId:    msgId,
                    destinations: Array.from(voiceDests),
                    from:         SALA_ID
                })
            });
            if (resp.status === 413) {
                const sts = document.getElementById('voice-status-txt');
                if (sts) sts.textContent = 'Messaggio troppo pesante.';
                setVoiceState('failed');
                setTimeout(() => setVoiceState('idle'), 4000);
                return;
            }
            let result;
            try { result = await resp.json(); } catch { result = { success: false }; }
            if (!result.success) {
                const sts = document.getElementById('voice-status-txt');
                if (sts) sts.textContent = result.error || 'Invio fallito. Riprova.';
                setVoiceState('failed');
                setTimeout(() => setVoiceState('idle'), 4000);
                return;
            }
            setVoiceState('done');
        } catch (e) {
            console.error('[voice] send error:', e);
            const sts = document.getElementById('voice-status-txt');
            if (sts) sts.textContent = 'Errore di rete.';
            setVoiceState('failed');
            setTimeout(() => setVoiceState('idle'), 4000);
        }
    }

    // ── Incoming voice messages ──────────────────────────────────────────────
    function handleVoiceMessage(data) {
        // Filter: __sala__ must be in the destinations array
        const dests = Array.isArray(data.destinations) ? data.destinations
                    : (data.destination ? [data.destination] : []);
        if (!dests.includes(SALA_ID)) return;

        // Resolve sender name from departmentMap
        const srcId    = data.sourceDepartmentId || data.from || '';
        const fromName = (srcId && departmentMap[srcId]) ? departmentMap[srcId].name : 'Reparto';

        let blobUrl = null;
        if (data.audioData) {
            try {
                const bytes = atob(data.audioData);
                const arr   = new Uint8Array(bytes.length);
                for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
                blobUrl = URL.createObjectURL(new Blob([arr], { type: 'audio/webm' }));
            } catch (e) { console.error('[voice] decode error:', e); }
        }

        voiceMessages.set(data.messageId, {
            id:        data.messageId,
            fromName,
            timestamp: data.timestamp || new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }),
            blobUrl,
            text:      data.message || ''
        });
        renderVoiceMessages();
        // Auto-play: queue and play sequentially without user action.
        _vmEnqueuePlay(blobUrl);
    }

    function dismissVoice(id) {
        const vm = voiceMessages.get(id);
        if (!vm) return;
        if (vm.blobUrl) URL.revokeObjectURL(vm.blobUrl);
        voiceMessages.delete(id);
        renderVoiceMessages();
    }

    function renderVoiceMessages() {
        const section = document.getElementById('voice-msgs-section');
        const list    = document.getElementById('voice-msg-list');
        const badge   = document.getElementById('voice-msg-count');
        if (!section || !list) return;
        if (!voiceMessages.size) { section.style.display = 'none'; return; }
        section.style.display = 'block';
        if (badge) badge.textContent = voiceMessages.size;
        list.innerHTML = Array.from(voiceMessages.values()).reverse().map(vm => `
            <div class="vm-item">
              <span class="vm-from">📞 ${esc(vm.fromName)}</span>
              ${vm.blobUrl
                ? `<audio class="vm-audio" controls src="${vm.blobUrl}"></audio>`
                : `<span style="flex:1;font-size:13px;color:var(--muted);">${esc(vm.text)}</span>`}
              <button class="vm-dismiss" onclick="dismissVoice('${esc(vm.id)}')" title="Rimuovi">✕</button>
            </div>`).join('');
    }

    let companyName = localStorage.getItem('userCompany');
    if (!companyName) {
        alert(_t('sala.companyMissing'));
        window.location.href = 'index.html';
    }
    companyName = companyName.trim().toLowerCase();

    // Populate header company name (display only)
    document.getElementById('hdr-company').textContent = localStorage.getItem('userCompany') || 'Servizio';

    // Map of deptId → department object (name, active)
    let departmentMap = {};

    async function loadDepartments() {
        const token = WsAuth.getStoredToken();
        if (!token) return;
        try {
            const res = await fetch('/api/departments', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (data.success && data.departments) {
                departmentMap = {};
                data.departments.forEach(d => { departmentMap[d.id] = d; });
                buildFilterButtons(data.departments.filter(d => d.active));
                buildVoiceDestList();
            }
        } catch (e) { console.warn('Could not load departments for sala:', e.message); }
    }

    function buildFilterButtons(activeDepts) {
        const group = document.getElementById('filter-group');
        if (!group) return;
        // Remove old dept buttons (keep "Tutti")
        Array.from(group.querySelectorAll('[data-dept]')).forEach(el => el.remove());
        activeDepts.forEach(d => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.dataset.filter = d.id;
            btn.dataset.dept = '1';
            btn.textContent = d.name;
            btn.addEventListener('click', () => {
                group.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = d.id;
                renderCountdowns();
            });
            group.appendChild(btn);
        });
    }

    function initializePage() {
        loadDepartments();
        loadInitialCountdowns();
        subscribeToUpdates();
        startAutoRefresh();
        setupEventListeners();
    }

    function loadInitialCountdowns() {
        CountdownsModule.fetchActiveCountdowns(companyName)
            .then(data => {
                // Initialize alarm flags — suppress alarms for countdowns that are already
                // past their threshold so reconnects / page loads don't replay old alarms.
                countdowns = data.map(cd => {
                    const tr = cd.remainingTime != null ? cd.remainingTime : (cd.timeRemaining || 0);
                    // The REST API returns endsAt directly (server-authoritative epoch ms).
                    // Fall back to approximation only when the field is absent.
                    const endsAt = cd.endsAt || (Date.now() + tr * 1000);
                    return {
                        ...cd,
                        remainingTime:  tr,
                        startTime:      cd.startTime || Date.now(),
                        endsAt,
                        warnedAt60:     tr <= 60,
                        alarmedExpiry:  tr === 0,
                        expiredAt:      null  // updateAllCountdowns sets this to endsAt on first 0-tick
                    };
                });
                renderCountdowns();
                updateStatistics();
            })
            .catch(error => {
                console.error('Error loading countdowns:', error);
            });
    }

    function subscribeToUpdates() {
        subscription = CountdownsModule.subscribeCountdowns({
            companyName: companyName,
            pageType: SALA_ID,
            onCountdownUpdate: (data) => {
                updateCountdown(data);
            },
            onCountdownDelete: (tableNumber) => {
                deleteCountdown(tableNumber);
            },
            onConnectionStatus: (connected) => {
                updateConnectionStatus(connected);
            },
            onVoiceMessage: (data) => {
                handleVoiceMessage(data);
            }
        });
    }

    function startAutoRefresh() {
        updateInterval = setInterval(() => {
            updateAllCountdowns();
        }, 1000);
    }

    function updateAllCountdowns() {
        const now = Date.now();

        countdowns = countdowns.reduce((acc, cd) => {
            // ── Expired phase: blink for 15 s then drop ──────────────────────
            // Measure elapsed time from cd.endsAt (server-authoritative), not from
            // when this client first noticed the crossing.  This keeps the 15-second
            // window consistent across page refreshes and across different browsers.
            if (cd.expiredAt !== null) {
                if (now - cd.expiredAt >= 15000) return acc; // drop after 15 s
                acc.push({ ...cd, remainingTime: 0, remainingTimeFormatted: '0:00' });
                return acc;
            }

            const prevRem = cd.remainingTime;
            // Derive remaining time from endsAt so it is anchored to the same
            // authoritative end point regardless of when the browser received the data.
            const rem = Math.max(0, Math.floor((cd.endsAt - now) / 1000));

            // ── 60-second warning (handles skipped ticks) ────────────────────
            // Alarm flags are read but never written here when the countdown already
            // exists — they were initialized at creation and are only set true once.
            if (!cd.warnedAt60 && prevRem > 60 && rem <= 60) {
                playAlarm('snd-warn');
                cd.warnedAt60 = true;
            }

            if (rem === 0) {
                // Transition to expired phase — anchor expiredAt to endsAt.
                const expiredAt = cd.endsAt;
                if (!cd.alarmedExpiry) {
                    playAlarm('snd-expiry');
                    cd.alarmedExpiry = true;
                }
                acc.push({
                    ...cd,
                    remainingTime:          0,
                    remainingTimeFormatted: '0:00',
                    expiredAt,
                    warnedAt60:    true,
                    alarmedExpiry: true
                });
                return acc;
            }

            acc.push({
                ...cd,
                remainingTime:          rem,
                remainingTimeFormatted: CountdownsModule.formatTime(rem)
            });
            return acc;
        }, []);

        renderCountdowns();
        updateStatistics();
    }

    function updateCountdown(data) {
        const tr = data.timeRemaining;
        const existingIndex = countdowns.findIndex(c => c.tableNumber == data.tableNumber);

        if (existingIndex !== -1) {
            const existing = countdowns[existingIndex];

            const incomingDests = Array.isArray(data.destinations)
                ? data.destinations
                : (data.destination ? [data.destination] : []);
            incomingDests.forEach(d => {
                if (!existing.destinations.includes(d)) existing.destinations.push(d);
            });

            // Update only the authoritative timing fields.
            // Alarm flags (warnedAt60, alarmedExpiry, expiredAt) are NEVER overwritten —
            // they are managed exclusively by updateAllCountdowns() so frequent or
            // out-of-order WS messages cannot suppress or duplicate threshold crossings.
            if (!existing.expiredAt) {
                // Use the server-supplied endsAt (epoch ms, computed from server clock).
                // Fall back to approximation only for old payloads that lack the field.
                existing.endsAt = data.endsAt ?? (Date.now() + tr * 1000);
            }
            existing.remainingTime = tr;
            // Preserve the original full duration so the progress bar stays correct.
            // Never replace it with the current remaining time.
            existing.initialDuration        = data.initialDuration ?? existing.initialDuration;
            existing.remainingTimeFormatted = CountdownsModule.formatTime(tr);
        } else {
            // New arrival — initialize alarm flags so alarms already passed are not replayed
            // (handles reconnects and joining a countdown that is already in progress).
            countdowns.push({
                tableNumber:            data.tableNumber,
                remainingTime:          tr,
                initialDuration:        data.initialDuration ?? tr,
                endsAt:                 data.endsAt ?? (Date.now() + tr * 1000),
                destinations:           Array.isArray(data.destinations) ? data.destinations : (data.destination ? [data.destination] : []),
                startedAt:              new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }),
                startTime:              Date.now(),
                status:                 'active',
                remainingTimeFormatted: CountdownsModule.formatTime(tr),
                warnedAt60:             tr <= 60,
                alarmedExpiry:          tr === 0,
                expiredAt:              null  // updateAllCountdowns sets this to endsAt on first 0-tick
            });
        }

        renderCountdowns();
        updateStatistics();
    }

    function deleteCountdown(tableNumber) {
        countdowns = countdowns.filter(c => c.tableNumber != tableNumber);
        renderCountdowns();
        updateStatistics();
    }

    function renderCountdowns() {
        const container = document.getElementById('countdownsList');
        
        let filtered = countdowns.filter(c => {
            const matchesSearch = searchTerm === '' || 
                c.tableNumber.toString().includes(searchTerm);
            
            const matchesFilter = activeFilter === 'all' || 
                (c.destinations && c.destinations.includes(activeFilter));
            
            return matchesSearch && matchesFilter;
        });

        filtered.sort((a, b) => a.remainingTime - b.remainingTime);

        const visibleCount = document.getElementById('visibleCount');
        if (visibleCount) visibleCount.textContent = filtered.length;

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🍽️</div>
                    <div class="empty-state-text">${_t('sala.noActive')}</div>
                </div>
            `;
            return;
        }

        container.innerHTML = filtered.map(countdown => {
            const isExpired   = countdown.expiredAt !== null;
            const alertLevel  = isExpired
                ? 'expired'
                : CountdownsModule.getAlertLevel(countdown.remainingTime);
            const statusClass = isExpired ? 'alert' : countdown.remainingTime < 120 ? 'alert' : 'active';
            const initialTimeFormatted = CountdownsModule.formatTime(countdown.initialDuration);

            const stationBadges = countdown.destinations && countdown.destinations.length > 0
                ? countdown.destinations.map(dest =>
                    `<span class="station-badge">${getStationIcon(dest)}</span>`
                  ).join('')
                : '<span class="station-badge">🍳 Cucina</span>';

            return `
                <div class="cd-card ${alertLevel}">
                    <div class="cd-table">T${countdown.tableNumber}</div>
                    <div class="cd-stations">${stationBadges}</div>
                    <div class="cd-meta">
                        <div class="cd-meta-row">${_t('sala.start')} <strong>${countdown.startedAt}</strong></div>
                        <div class="cd-meta-row">${_t('sala.duration')} <strong>${initialTimeFormatted}</strong></div>
                    </div>
                    <div class="cd-time ${alertLevel}">${countdown.remainingTimeFormatted}</div>
                    <span class="status-badge ${statusClass}">
                        ${isExpired ? _t('sala.expired') : statusClass === 'alert' ? _t('sala.urgent') : _t('sala.active')}
                    </span>
                </div>
            `;
        }).join('');
    }

    function getStationIcon(station) {
        // Look up department name from map; fall back to raw ID
        if (departmentMap[station]) return departmentMap[station].name;
        // Legacy names for old countdown records
        const legacy = { 'cucina': '🍳 Cucina', 'pizzeria': '🍕 Pizzeria', 'insalata': '🥗 Insalata' };
        return legacy[station] || station;
    }

    function updateStatistics() {
        document.getElementById('activeCount').textContent = countdowns.length;
        
        const uniqueTables = new Set(countdowns.map(c => c.tableNumber)).size;
        document.getElementById('tableCount').textContent = uniqueTables;

        const avgTime = CountdownsModule.calculateAverageWaitTime(countdowns);
        document.getElementById('avgTime').textContent = CountdownsModule.formatTime(avgTime);
    }

    function updateConnectionStatus(connected) {
        const statusEl = document.getElementById('connectionStatus');
        if (connected) {
            statusEl.className = 'conn-badge ok';
            statusEl.innerHTML = _t('sala.connected');
        } else {
            statusEl.className = 'conn-badge';
            statusEl.innerHTML = _t('sala.reconnecting');
        }
    }

    function setupEventListeners() {
        const searchInput = document.getElementById('searchInput');
        let debounceTimer;
        
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                searchTerm = e.target.value.toLowerCase();
                renderCountdowns();
            }, 150);
        });

        // "Tutti" button — department buttons are wired inside buildFilterButtons
        const tuttiBtn = document.querySelector('.filter-btn[data-filter="all"]');
        if (tuttiBtn) {
            tuttiBtn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                tuttiBtn.classList.add('active');
                activeFilter = 'all';
                renderCountdowns();
            });
        }
    }

    I18n.init({ selector: '#i18n-sala-sel' }).then(() => {
        window.addEventListener('load', initializePage);
    });

    window.addEventListener('beforeunload', () => {
        if (subscription) {
            subscription.disconnect();
        }
        if (updateInterval) {
            clearInterval(updateInterval);
        }
    });
</script>
</body>
</html>
