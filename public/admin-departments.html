<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Reparti — PlateTimer</title>
<style>
:root {
  --bg:       #F1F5F9;
  --panel:    #FFFFFF;
  --card:     #FFFFFF;
  --card-h:   #F8FAFC;
  --border:   #E2E8F0;
  --border-l: #CBD5E1;
  --text:     #0F172A;
  --muted:    #64748B;
  --accent:   #4F46E5;
  --accent2:  #6366F1;
  --warn:     #D97706;
  --danger:   #DC2626;
  --ok:       #16A34A;
  --hdr:      56px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden;}

/* ── HEADER ─────────────────────────────── */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);
  background:rgba(255,255,255,.97);box-shadow:0 1px 3px rgba(0,0,0,.08);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 16px;z-index:200;}
.hdr-brand{font-size:15px;font-weight:700;color:var(--accent2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.hdr-sep{width:1px;height:20px;background:var(--border-l);flex-shrink:0;}
.hdr-page{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;flex:1;}
.hdr-btn{padding:7px 14px;border:1px solid var(--border-l);border-radius:7px;
  background:rgba(0,0,0,.04);color:var(--text);font-size:13px;cursor:pointer;
  white-space:nowrap;flex-shrink:0;transition:background .15s;}
.hdr-btn:hover{background:rgba(0,0,0,.09);}
.hdr-btn.danger{border-color:rgba(220,38,38,.35);color:var(--danger);}
.hdr-btn.danger:hover{background:rgba(220,38,38,.08);}

/* ── MAIN CONTAINER ─────────────────────── */
.main{max-width:1200px;margin:0 auto;padding:calc(var(--hdr) + 28px) 20px 40px;}

/* ── PAGE HEADING ───────────────────────── */
.pg-heading{margin-bottom:28px;}
.pg-title{font-size:24px;font-weight:800;color:var(--text);margin-bottom:4px;}
.pg-sub{font-size:14px;color:var(--muted);margin-bottom:12px;}
.plan-badge{display:inline-flex;align-items:center;gap:6px;
  background:rgba(79,70,229,.08);border:1px solid rgba(79,70,229,.25);
  color:var(--accent);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;}

/* ── SUMMARY ROW ────────────────────────── */
.summary-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
@media(max-width:700px){.summary-row{grid-template-columns:1fr;}}

/* ── CARD ───────────────────────────────── */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:22px;}
.card-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);margin-bottom:16px;}

/* ── USAGE CARD ─────────────────────────── */
.usage-count{font-size:26px;font-weight:800;color:var(--text);line-height:1;}
.usage-sub{font-size:13px;color:var(--muted);margin-top:4px;margin-bottom:14px;}
.limit-bar{background:rgba(0,0,0,.07);border-radius:8px;height:8px;overflow:hidden;}
.limit-bar-fill{height:100%;border-radius:8px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s;}
.limit-bar-fill.at-limit{background:linear-gradient(90deg,var(--danger),#f97316);}
.usage-msg{font-size:13px;font-weight:600;margin-top:10px;}
.usage-msg.ok{color:var(--ok);}
.usage-msg.warn{color:var(--danger);}

/* ── CREATE CARD ────────────────────────── */
.form-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block;}
.form-input{width:100%;padding:11px 14px;
  background:white;border:1.5px solid var(--border-l);
  border-radius:9px;color:var(--text);font-size:14px;outline:none;
  transition:border-color .15s;margin-bottom:10px;}
.form-input::placeholder{color:var(--muted);}
.form-input:focus{border-color:var(--accent);}
.form-input:disabled{opacity:.4;cursor:not-allowed;}
.limit-notice{font-size:13px;color:var(--danger);margin-bottom:10px;
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);
  border-radius:8px;padding:10px 12px;line-height:1.5;}

/* ── BUTTONS ────────────────────────────── */
.btn{padding:10px 18px;border:none;border-radius:9px;cursor:pointer;
  font-size:14px;font-weight:600;transition:all .15s;white-space:nowrap;}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none !important;}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;width:100%;}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(99,102,241,.35);}
.btn-sm{padding:7px 12px;font-size:12px;}
.btn-sm.btn-primary{width:auto;}
.btn-neutral{background:rgba(0,0,0,.04);color:var(--text);border:1px solid var(--border-l);}
.btn-neutral:hover:not(:disabled){background:rgba(0,0,0,.08);}
.btn-danger{background:rgba(239,68,68,.08);color:var(--danger);border:1px solid rgba(220,38,38,.2);}
.btn-danger:hover:not(:disabled){background:rgba(239,68,68,.15);}
.btn-danger:disabled{opacity:.25;cursor:not-allowed;}
.btn-warn{background:rgba(234,179,8,.08);color:#92400e;border:1px solid rgba(234,179,8,.25);}
.btn-warn:hover:not(:disabled){background:rgba(234,179,8,.15);}

/* ── FEEDBACK MESSAGES ──────────────────── */
.msg{display:none;padding:10px 14px;border-radius:8px;font-size:13px;margin-top:10px;}
.msg-error{background:rgba(220,38,38,.07);color:var(--danger);border:1px solid rgba(220,38,38,.2);}
.msg-success{background:rgba(22,163,74,.07);color:var(--ok);border:1px solid rgba(22,163,74,.2);}

/* ── SECTION TITLE ──────────────────────── */
.section-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:14px;}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);font-size:15px;}

/* ── DEPARTMENTS TABLE ──────────────────── */
.table-wrap{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;overflow-x:auto;}
.dept-table{width:100%;border-collapse:collapse;min-width:680px;}
.dept-table th{
  background:var(--card-h);padding:11px 14px;text-align:left;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.55px;
  color:var(--muted);border-bottom:1.5px solid var(--border);white-space:nowrap;}
.dept-table td{
  padding:12px 14px;border-bottom:1px solid var(--border);
  font-size:13px;vertical-align:middle;}
.dept-table tbody tr:last-of-type td{border-bottom:none;}
.dept-table tbody tr.inactive-dept td{opacity:.5;}
.dept-table tbody tr.inactive-dept td .btn{opacity:1 !important;}

/* ── BADGES ─────────────────────────────── */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:20px;white-space:nowrap;}
.badge-active  {background:rgba(22,163,74,.12); color:var(--ok);   border:1px solid rgba(22,163,74,.2);}
.badge-susp    {background:rgba(220,38,38,.08); color:var(--danger);border:1px solid rgba(220,38,38,.15);}
.badge-inactive{background:rgba(220,38,38,.08); color:var(--danger);border:1px solid rgba(220,38,38,.15);}
.badge-dept-on {background:rgba(22,163,74,.12); color:var(--ok);   border:1px solid rgba(22,163,74,.2);}
.badge-dept-off{background:rgba(100,116,139,.1);color:var(--muted);border:1px solid var(--border);}
.badge-central {background:rgba(79,70,229,.1);  color:var(--accent);border:1px solid rgba(79,70,229,.25);}
.badge-standard{background:rgba(100,116,139,.08);color:var(--muted);border:1px solid var(--border);}
.badge-used    {background:rgba(0,0,0,.05);     color:var(--muted);border:1px solid var(--border);}

/* ── TABLE ACTIONS CELL ─────────────────── */
.action-group{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.action-sep{width:1px;height:18px;background:var(--border-l);margin:0 2px;flex-shrink:0;}
.dept-name-cell{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.dept-name-text{font-weight:700;color:var(--text);}
.dash-muted{color:var(--muted);}

/* ── INLINE ACCOUNT FORM ROW ────────────── */
.form-row{background:var(--card-h);}
.form-row td{padding:14px 16px;border-top:1px dashed var(--border);}
.acct-form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.acct-form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px;}
.acct-form-group label{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.4px;color:var(--muted);}
.form-input-sm{padding:8px 10px;border:1.5px solid var(--border-l);border-radius:8px;
  font-size:13px;color:var(--text);background:white;outline:none;width:100%;
  transition:border-color .15s;}
.form-input-sm:focus{border-color:var(--accent);}
.acct-form-btns{display:flex;gap:8px;align-items:center;flex-shrink:0;padding-bottom:1px;}
.form-inline-err{font-size:12px;color:var(--danger);margin-top:6px;
  display:none;background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.15);
  border-radius:6px;padding:6px 10px;}
</style>
</head>
<body>

<!-- ── HEADER ────────────────────────────── -->
<header class="hdr">
  <span id="hdr-company" class="hdr-brand"></span>
  <span class="hdr-sep"></span>
  <span class="hdr-page" data-i18n="admin.heading">Gestione Reparti</span>
  <span id="i18n-admin-sel"></span>
  <button class="hdr-btn" onclick="window.location.href='home.html'" data-i18n="common.home">Home</button>
  <button class="hdr-btn danger" onclick="logout()" data-i18n="common.logout">Esci</button>
</header>

<!-- ── MAIN ──────────────────────────────── -->
<main class="main">

  <!-- Page heading -->
  <div class="pg-heading">
    <h1 class="pg-title" data-i18n="admin.heading">Gestione Reparti</h1>
    <p id="pg-company" class="pg-sub"></p>
    <span id="plan-badge" class="plan-badge">Piano: …</span>
  </div>

  <!-- Summary row -->
  <div class="summary-row">

    <!-- Usage card -->
    <div class="card">
      <p class="card-title" data-i18n="admin.usage">Utilizzo Reparti</p>
      <div id="usage-count" class="usage-count">—</div>
      <div id="usage-sub" class="usage-sub">Caricamento…</div>
      <div class="limit-bar"><div id="limit-bar-fill" class="limit-bar-fill" style="width:0%"></div></div>
      <div id="usage-msg" class="usage-msg"></div>
    </div>

    <!-- Create card -->
    <div class="card">
      <p class="card-title" data-i18n="admin.createHeading">Crea Nuovo Reparto</p>
      <div id="limit-notice" class="limit-notice" style="display:none;"></div>
      <label class="form-label" for="dept-name-input" data-i18n="admin.colName">Nome reparto</label>
      <input id="dept-name-input" class="form-input" type="text"
             placeholder="es. Cucina, Bar, Pasticceria…" maxlength="40">
      <button id="create-btn" class="btn btn-primary" onclick="createDepartment()" data-i18n="admin.createBtn">Crea reparto</button>
      <div id="error-msg" class="msg msg-error"></div>
      <div id="success-msg" class="msg msg-success"></div>
    </div>

  </div>

  <!-- Departments table -->
  <p class="section-title" data-i18n="admin.tableHeading">Reparti configurati</p>
  <div class="table-wrap">
    <table class="dept-table">
      <thead>
        <tr>
          <th data-i18n="admin.colName">Nome</th>
          <th data-i18n="admin.colType">Tipo</th>
          <th data-i18n="admin.colLogin">Login</th>
          <th data-i18n="admin.colPassword">Password</th>
          <th data-i18n="admin.colStatus">Stato Account</th>
          <th data-i18n="admin.colActions">Azioni</th>
        </tr>
      </thead>
      <tbody id="dept-table-body">
        <tr><td colspan="6" class="empty-state" data-i18n="admin.loading">Caricamento…</td></tr>
      </tbody>
    </table>
  </div>

</main>

<script src="js/i18n.js"></script>
<script src="js/ws-auth.js"></script>
<script>
    const _t = k => window.I18n ? window.I18n.t(k) : k;
    const token = WsAuth.getStoredToken();
    if (!token) {
        alert(_t('common.sessionExpired'));
        window.location.href = 'index.html';
    }

    const companyName = localStorage.getItem('userCompany') || '';
    document.getElementById('hdr-company').textContent = companyName;
    document.getElementById('pg-company').textContent = companyName;

    let departments = [];
    let accounts    = [];
    let planLimit   = 3;
    let planName    = 'base';
    let editingId   = null;   // deptId currently showing an inline form

    function logout() {
        if (typeof WsAuth !== 'undefined' && WsAuth.clearToken) WsAuth.clearToken();
        window.location.href = 'index.html';
    }

    async function apiFetch(path, opts = {}) {
        const res = await fetch(path, {
            ...opts,
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(opts.headers || {})
            }
        });
        return res.json();
    }

    // ── Data loading ──────────────────────────────────────────────────
    async function loadAll() {
        const [dData, aData] = await Promise.all([
            apiFetch('/api/departments'),
            apiFetch('/api/department-accounts')
        ]);
        if (dData.success) {
            departments = dData.departments || [];
            planName    = dData.plan  || 'base';
            planLimit   = dData.limit || 3;
        }
        if (aData.success) {
            accounts = aData.accounts || [];
        }
        renderAll();
    }

    function getAccountForDept(deptId) {
        return accounts.find(a => a.departmentId === deptId) || null;
    }

    // ── Render ────────────────────────────────────────────────────────
    function renderAll() {
        // Usage card
        const active  = departments.filter(d => d.active).length;
        const total   = departments.length;
        const atLimit = active >= planLimit;
        const planLabels = { base:'Base', medium:'Medium', premium:'Premium' };
        document.getElementById('plan-badge').textContent =
            `${_t('admin.plan')} ${planLabels[planName] || planName} — max ${planLimit}`;
        document.getElementById('usage-count').textContent = `${active} / ${planLimit}`;
        document.getElementById('usage-sub').textContent =
            `${active} ${_t('admin.activeOf')} ${planLimit} (${total} ${_t('admin.total')})`;
        const pct  = planLimit > 0 ? Math.min(100, Math.round((active / planLimit) * 100)) : 0;
        const fill = document.getElementById('limit-bar-fill');
        fill.style.width = pct + '%';
        fill.classList.toggle('at-limit', atLimit);
        const usageMsg = document.getElementById('usage-msg');
        if (atLimit) {
            usageMsg.textContent = _t('admin.limitReached');
            usageMsg.className   = 'usage-msg warn';
        } else {
            usageMsg.textContent = `${planLimit - active} ${_t('admin.slotAvailable')}`;
            usageMsg.className   = 'usage-msg ok';
        }

        // Create form lock
        const limitNotice = document.getElementById('limit-notice');
        const input       = document.getElementById('dept-name-input');
        const createBtn   = document.getElementById('create-btn');
        if (atLimit) {
            limitNotice.textContent = _t('admin.atLimitNotice');
            limitNotice.style.display = 'block';
            input.disabled = true; createBtn.disabled = true;
        } else {
            limitNotice.style.display = 'none';
            input.disabled = false; createBtn.disabled = false;
        }

        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('dept-table-body');
        if (departments.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="empty-state">${_t('admin.noConfig')}</td></tr>`;
            return;
        }

        tbody.innerHTML = departments.map(d => {
            const acct    = getAccountForDept(d.id);
            const type    = d.departmentType === 'CENTRAL' ? 'CENTRAL' : 'STANDARD';
            const typeBadge = type === 'CENTRAL'
                ? '<span class="badge badge-central">CENTRAL</span>'
                : '<span class="badge badge-standard">STANDARD</span>';

            // Login / Password / Account-status cells
            let loginCell, passCell, statusCell, acctBtns;
            if (acct) {
                loginCell  = `<span>${escHtml(acct.loginIdentifier || '—')}</span>`;
                passCell   = acct.hasPassword ? '<span class="dash-muted">••••••</span>' : '<span class="dash-muted">—</span>';
                const isActive = acct.status === 'ACTIVE';
                statusCell = isActive
                    ? `<span class="badge badge-active">${_t('admin.accountActive')}</span>`
                    : `<span class="badge badge-susp">${_t('admin.accountSuspended')}</span>`;
                acctBtns = `
                    <button class="btn btn-sm btn-neutral" onclick="openEdit('${d.id}')">${_t('admin.edit')}</button>
                    <button class="btn btn-sm ${isActive ? 'btn-warn' : 'btn-neutral'}"
                        onclick="toggleAcctStatus('${acct.id}','${isActive ? 'SUSPENDED' : 'ACTIVE'}')">${isActive ? _t('admin.suspend') : _t('admin.reactivate')}</button>`;
            } else {
                loginCell  = '<span class="dash-muted">—</span>';
                passCell   = '<span class="dash-muted">—</span>';
                statusCell = '<span class="dash-muted">—</span>';
                acctBtns   = `<button class="btn btn-sm btn-primary" onclick="openCreate('${d.id}')">${_t('admin.createAccount')}</button>`;
            }

            // Department active/inactive + delete
            const canDelete = !d.usedInCountdowns;
            const deptBtns = `
                <button class="btn btn-sm btn-neutral"
                    onclick="toggleDept('${d.id}',${!d.active})">${d.active ? _t('admin.deactivate') : _t('admin.activate')}</button>
                ${canDelete
                    ? `<button class="btn btn-sm btn-danger" onclick="deleteDept('${d.id}')">${_t('admin.delete')}</button>`
                    : `<button class="btn btn-sm btn-danger" disabled title="${_t('admin.alreadyInUse')}">${_t('admin.delete')}</button>`}`;

            return `
                <tr class="${d.active ? '' : 'inactive-dept'}">
                  <td>
                    <div class="dept-name-cell">
                      <span class="dept-name-text">${escHtml(d.name)}</span>
                      <span class="badge ${d.active ? 'badge-dept-on' : 'badge-dept-off'}">${d.active ? _t('admin.deptActive') : _t('admin.deptInactive')}</span>
                      ${d.usedInCountdowns ? `<span class="badge badge-used">${_t('admin.inUse')}</span>` : ''}
                    </div>
                  </td>
                  <td>${typeBadge}</td>
                  <td>${loginCell}</td>
                  <td>${passCell}</td>
                  <td>${statusCell}</td>
                  <td>
                    <div class="action-group">
                      ${acctBtns}
                      <span class="action-sep"></span>
                      ${deptBtns}
                    </div>
                  </td>
                </tr>
                <tr id="form-row-${d.id}" class="form-row" style="display:none">
                  <td colspan="6" id="form-cell-${d.id}"></td>
                </tr>`;
        }).join('');

        // Re-open the inline form if one was active before re-render
        if (editingId) {
            const row = document.getElementById(`form-row-${editingId}`);
            if (row) row.style.display = '';
            else editingId = null;
        }
    }

    // ── Inline form helpers ───────────────────────────────────────────
    function closeForm() {
        if (editingId) {
            const row = document.getElementById(`form-row-${editingId}`);
            if (row) row.style.display = 'none';
            editingId = null;
        }
    }

    function showFormErr(deptId, msg) {
        const el = document.getElementById(`form-err-${deptId}`);
        if (!el) return;
        el.textContent = msg;
        el.style.display = 'block';
    }
    function hideFormErr(deptId) {
        const el = document.getElementById(`form-err-${deptId}`);
        if (el) el.style.display = 'none';
    }

    function openCreate(deptId) {
        if (editingId === deptId) { closeForm(); return; }
        closeForm();
        editingId = deptId;
        document.getElementById(`form-cell-${deptId}`).innerHTML = `
            <div class="acct-form">
              <div class="acct-form-group">
                <label>${_t('admin.accountLogin')}</label>
                <input id="f-login-${deptId}" class="form-input-sm" type="text"
                       placeholder="${_t('admin.loginPlaceholder')}" autocomplete="off">
              </div>
              <div class="acct-form-group">
                <label>${_t('admin.accountPassword')}</label>
                <input id="f-pass-${deptId}" class="form-input-sm" type="text"
                       placeholder="${_t('admin.passwordPlaceholder')}" autocomplete="off">
              </div>
              <div class="acct-form-btns">
                <button class="btn btn-sm btn-primary" onclick="submitCreate('${deptId}')">${_t('admin.create')}</button>
                <button class="btn btn-sm btn-neutral" onclick="closeForm()">${_t('common.cancel')}</button>
              </div>
            </div>
            <div id="form-err-${deptId}" class="form-inline-err"></div>`;
        document.getElementById(`form-row-${deptId}`).style.display = '';
        document.getElementById(`f-login-${deptId}`).focus();
    }

    function openEdit(deptId) {
        const acct = getAccountForDept(deptId);
        if (!acct) return;
        if (editingId === deptId) { closeForm(); return; }
        closeForm();
        editingId = deptId;
        document.getElementById(`form-cell-${deptId}`).innerHTML = `
            <div class="acct-form">
              <div class="acct-form-group">
                <label>${_t('admin.accountLogin')}</label>
                <input id="f-login-${deptId}" class="form-input-sm" type="text"
                       value="${escHtml(acct.loginIdentifier || '')}" autocomplete="off">
              </div>
              <div class="acct-form-group">
                <label>${_t('admin.accountNewPassword')}</label>
                <input id="f-pass-${deptId}" class="form-input-sm" type="text"
                       placeholder="${_t('admin.newPasswordPlaceholder')}" autocomplete="off">
              </div>
              <div class="acct-form-btns">
                <button class="btn btn-sm btn-primary" onclick="submitEdit('${acct.id}','${deptId}')">${_t('admin.save')}</button>
                <button class="btn btn-sm btn-neutral" onclick="closeForm()">${_t('common.cancel')}</button>
              </div>
            </div>
            <div id="form-err-${deptId}" class="form-inline-err"></div>`;
        document.getElementById(`form-row-${deptId}`).style.display = '';
        document.getElementById(`f-login-${deptId}`).focus();
    }

    // ── Account mutations ─────────────────────────────────────────────
    async function submitCreate(deptId) {
        const login = (document.getElementById(`f-login-${deptId}`)?.value || '').trim();
        const pass  = (document.getElementById(`f-pass-${deptId}`)?.value  || '').trim();
        hideFormErr(deptId);
        if (!login) { showFormErr(deptId, _t('admin.loginRequired')); return; }
        if (!pass)  { showFormErr(deptId, _t('admin.passwordRequired')); return; }

        const data = await apiFetch('/api/department-accounts', {
            method: 'POST',
            body: JSON.stringify({ departmentId: deptId, loginIdentifier: login, password: pass })
        });
        if (data.success) {
            editingId = null;          // clear before reload so form stays closed
            showSuccess(_t('admin.accountCreated'));
            await loadAll();
        } else {
            showFormErr(deptId, data.error || 'Errore nella creazione.');
        }
    }

    async function submitEdit(acctId, deptId) {
        const login = (document.getElementById(`f-login-${deptId}`)?.value || '').trim();
        const pass  = (document.getElementById(`f-pass-${deptId}`)?.value  || '').trim();
        hideFormErr(deptId);
        if (!login) { showFormErr(deptId, _t('admin.loginRequired')); return; }

        const body = { loginIdentifier: login };
        if (pass) body.password = pass;

        const data = await apiFetch(`/api/department-accounts/${acctId}`, {
            method: 'PATCH',
            body: JSON.stringify(body)
        });
        if (data.success) {
            editingId = null;
            showSuccess(_t('admin.accountUpdated'));
            await loadAll();
        } else {
            showFormErr(deptId, data.error || 'Errore.');
        }
    }

    async function toggleAcctStatus(acctId, newStatus) {
        clearMessages();
        const data = await apiFetch(`/api/department-accounts/${acctId}/status`, {
            method: 'PUT', body: JSON.stringify({ status: newStatus })
        });
        if (data.success) {
            showSuccess(newStatus === 'ACTIVE' ? _t('admin.accountReactivated') : _t('admin.accountSuspendedMsg'));
            await loadAll();
        } else {
            showError(data.error || 'Errore.');
        }
    }

    // ── Department mutations ──────────────────────────────────────────
    async function createDepartment() {
        const name = document.getElementById('dept-name-input').value.trim();
        if (!name) { showError(_t('admin.nameRequired')); return; }
        clearMessages();
        const btn = document.getElementById('create-btn');
        btn.disabled = true; btn.textContent = _t('admin.creating');

        const data = await apiFetch('/api/departments', { method: 'POST', body: JSON.stringify({ name }) });
        btn.disabled = false; btn.textContent = _t('admin.createBtn');

        if (data.success) {
            document.getElementById('dept-name-input').value = '';
            showSuccess(`Reparto "${data.department.name}" creato.`);
            await loadAll();
        } else {
            showError(data.error || 'Errore nella creazione.');
        }
    }

    async function toggleDept(id, newActive) {
        clearMessages();
        const data = await apiFetch(`/api/departments/${id}`, {
            method: 'PUT', body: JSON.stringify({ active: newActive })
        });
        if (data.success) { await loadAll(); }
        else { showError(data.error || 'Errore.'); }
    }

    async function deleteDept(id) {
        if (!confirm(_t('admin.confirmDelete'))) return;
        clearMessages();
        const data = await apiFetch(`/api/departments/${id}`, { method: 'DELETE' });
        if (data.success) { showSuccess(_t('admin.deptDeleted')); await loadAll(); }
        else { showError(data.error || 'Errore.'); }
    }

    // ── Feedback ──────────────────────────────────────────────────────
    function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg; el.style.display = 'block';
        document.getElementById('success-msg').style.display = 'none';
    }
    function showSuccess(msg) {
        const el = document.getElementById('success-msg');
        el.textContent = msg; el.style.display = 'block';
        document.getElementById('error-msg').style.display = 'none';
    }
    function clearMessages() {
        document.getElementById('error-msg').style.display   = 'none';
        document.getElementById('success-msg').style.display = 'none';
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('dept-name-input').addEventListener('keypress', e => {
        if (e.key === 'Enter') createDepartment();
    });

    I18n.init({ selector: '#i18n-admin-sel' }).then(loadAll);
</script>
</body>
</html>
